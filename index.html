<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>婚宴座位表 Seating Chart</title>
<style>
  :root { --rose:#b76e79; --rose-dark:#96525d; --rose-light:#f6e7e9; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; background:#faf7f5; color:#2d2a28; padding:16px; }
  .wrap { max-width:960px; margin:0 auto; }
  header { text-align:center; margin-bottom:16px; }
  .heart { color:var(--rose); font-size:26px; }
  h1 { font-size:22px; margin:4px 0 2px; }
  .sub { color:#a8a29e; font-size:14px; }
  .lang { background:none; border:none; color:#a8a29e; text-decoration:underline; cursor:pointer; font-size:12px; margin-top:4px; }
  .searchbox { max-width:420px; margin:0 auto 12px; position:relative; }
  .searchbox input { width:100%; padding:10px 16px 10px 38px; border-radius:999px; border:1px solid #d6d3d1; font-size:15px; outline:none; background:#fff; }
  .searchbox input:focus { border-color:var(--rose); }
  .searchbox svg { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:#a8a29e; }
  .viewtoggle { display:flex; justify-content:center; margin-bottom:10px; }
  .vbtn { border:1px solid #d6d3d1; background:#fff; padding:8px 16px; font-size:13px; color:#78716c; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .vbtn:first-child { border-radius:999px 0 0 999px; }
  .vbtn:not(:last-child) { border-right:none; }
  .vbtn:last-child { border-radius:0 999px 999px 0; }
  .vbtn.active { background:var(--rose); border-color:var(--rose); color:#fff; }
  .found { text-align:center; color:var(--rose-dark); font-size:15px; margin-bottom:12px; min-height:22px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
  /* 統計列 */
  .stats { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:12px; }
  .stat { background:#fff; border-radius:14px; padding:8px 14px; min-width:74px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .stat b { display:block; font-size:19px; color:var(--rose-dark); line-height:1.2; }
  .stat span { font-size:11px; color:#a8a29e; }
  .bar { max-width:420px; margin:0 auto 14px; height:7px; border-radius:999px; background:#eee7e4; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--rose); border-radius:999px; transition:width .4s; }
  .scrollhint { text-align:center; font-size:11px; color:#a8a29e; margin-bottom:6px; }
  .card { background:#fff; border:2px solid transparent; border-radius:18px; padding:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .card.hit { border-color:var(--rose); }
  .card.dim { opacity:.45; }
  .card h3 { font-size:16px; display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .cap { font-size:12px; background:#f5f5f4; color:#57534e; border-radius:999px; padding:2px 8px; font-weight:normal; }
  .pos { font-size:11px; background:var(--rose-light); color:var(--rose-dark); border-radius:999px; padding:2px 8px; font-weight:normal; }
  .chips { display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:6px; }
  @media (max-width:480px) { .chips { grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); } }
  .chip { border:1px solid #e7e5e4; background:#fafaf9; color:#57534e; border-radius:999px; padding:3px 10px; font-size:14px;
    display:flex; align-items:center; gap:6px; min-width:0; overflow:hidden; }
  .chip .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip[data-g] { cursor:pointer; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  .chip[data-g]:active { background:var(--rose-light); border-color:var(--rose); }
  .chip .dot { width:7px; height:7px; border-radius:50%; display:inline-block; flex-shrink:0; }
  .dot.GROOM { background:#4f7cc0; } .dot.BRIDE { background:#d783a0; } .dot.BOTH { background:#a8a29e; } .dot.OTHER { background:#c08a4f; }
  .chip.hit { border-color:var(--rose); background:var(--rose-light); color:var(--rose-dark); font-weight:600; }
  footer { text-align:center; color:#d6d3d1; font-size:12px; margin-top:20px; padding-bottom:12px; }
  /* !important：確保能蓋過 #lock（ID 選擇器）的 display:flex */
  .hidden { display:none !important; }
  /* 平面圖 */
  .floorwrap { background:#fff; border-radius:18px; box-shadow:0 1px 3px rgba(0,0,0,.06); padding:12px; overflow-x:auto; }
  .floorinner { min-width:760px; max-width:880px; margin:0 auto; }
  .stagebar { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .stage { flex:1; border:2px solid #d6d3d1; background:#f5f5f4; border-radius:10px; text-align:center; padding:8px; color:#78716c; font-size:13px; }
  .sidenote { font-size:10px; color:#a8a29e; white-space:nowrap; }
  .floorcols { display:flex; justify-content:center; gap:12px; }
  .cgroup { display:flex; gap:12px; }
  .cgroup.leftpad { padding-top:56px; }
  .vcolwrap { display:flex; flex-direction:column; align-items:center; }
  .vcolwrap.headpad { padding-top:56px; }
  .vcol { display:flex; flex-direction:column; gap:8px; align-items:center; }
  .vcol.sp { justify-content:space-between; }
  .pc { width:48px; height:48px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:9px; line-height:1.2; border:2px solid; padding:0; background:none; font-family:inherit; }
  .pc.occ { background:var(--rose); border-color:var(--rose); color:#fff; cursor:pointer; }
  .pc.occ.main { background:var(--rose-dark); border-color:var(--rose-dark); }
  .pc.empty { border-style:dashed; border-color:#e7e5e4; color:#d6d3d1; cursor:default; }
  .pc .pcode { font-weight:600; }
  .pc .pname { max-width:42px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pc.hitc { box-shadow:0 0 0 4px #fcd34d; }
  .pc.dimc { opacity:.35; }
  .aisle { width:30px; align-self:stretch; background:#f5f5f4; border-radius:8px; display:flex; align-items:center; justify-content:center; }
  .aisle span { writing-mode:vertical-lr; font-size:10px; color:#a8a29e; letter-spacing:3px; }
  .entrances { display:flex; justify-content:space-around; align-items:center; border-top:1px solid #e7e5e4; margin-top:12px; padding-top:8px; font-size:10px; color:#a8a29e; }
  /* 桌次名單彈窗（唯讀） */
  #tmodal, #gmodal, #qmodal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:20; }
  #gmodal { z-index:25; }
  #qmodal { z-index:30; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:8px 14px; font-size:14px; margin:4px 0 14px; }
  .kv dt { color:#a8a29e; white-space:nowrap; }
  .kv dd { color:#44403c; word-break:break-word; }
  .ghint { text-align:center; font-size:11px; color:#a8a29e; margin:-4px 0 10px; }
  #shareWrap { margin-top:10px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  /* 帶位 QR 卡片 */
  .qrcard { text-align:center; }
  .qrcard h3 { display:block; font-size:17px; letter-spacing:3px; color:var(--rose-dark); margin:4px 0 2px; text-align:center; }
  .qrcard .qsub { font-size:12px; color:#a8a29e; }
  .qrbox { width:210px; margin:14px auto 0; }
  .qrbox svg { width:100%; height:auto; display:block; }
  .qrcard .qstep { margin-top:12px; font-size:13px; color:#57534e; }
  .qrcard .qurl { margin-top:10px; font-size:9px; color:#d6d3d1; word-break:break-all; }
  @media print {
    body > *:not(#qmodal) { display:none !important; }
    #qmodal { position:static !important; background:none !important; padding:0 !important; }
    #qmodal .tcard { box-shadow:none !important; max-width:none !important; max-height:none !important; }
    #qmodal .qrbox { width:420px; }
    #qmodal .tclose, #qmodal .qrbtns { display:none !important; }
    #qmodal .qrcard .qurl { color:#78716c; }
  }
  .sharebtn { border:1px solid var(--rose); background:#fff; color:var(--rose-dark); border-radius:999px;
    padding:7px 16px; font-size:13px; font-family:inherit; cursor:pointer; transition:all .15s; }
  .sharebtn:hover { background:var(--rose-light); }
  .sharebtn:active { transform:scale(.97); }
  .sharebtn.done { background:var(--rose); border-color:var(--rose); color:#fff; }
  /* ---------- 帶位模式：粉嫩剪紙風 ---------- */
  #seat { position:fixed; inset:0; z-index:60; color:#6b4a52;
    background:
      radial-gradient(120% 70% at 50% 0%, #ffd3de 0%, #ffe3ea 38%, #fff2f4 70%, #fffafa 100%);
    display:flex; flex-direction:column; align-items:center; padding:26px 22px 22px; overflow:hidden; }
  #seat.hidden { display:none !important; }
  /* 開場即帶位模式：蓋掉預設的密碼畫面 */
  html.sm #lock { display:none !important; }
  html.sm #seat.hidden { display:flex !important; }
  html.sm #seatBox, html.sm #seatTip { visibility:hidden; }
  #seatBoot { display:none; text-align:center; font-size:12px; color:#c08ea0; letter-spacing:2px; margin-top:4px; }
  html.sm #seatBoot { display:block; }
  /* 剪紙白框 */
  #seat::before { content:''; position:fixed; inset:14px; border:2px solid rgba(255,255,255,.95);
    border-radius:4px; pointer-events:none; box-shadow:0 0 0 1px rgba(216,150,168,.12), 0 8px 30px rgba(216,150,168,.14); }
  /* 裝飾層：愛心氣球、雲、花瓣 */
  #deco { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .blob { position:absolute; border-radius:50%; filter:blur(42px); opacity:.55; }
  .blob.b1 { width:260px; height:260px; left:-70px; top:-40px; background:#ffc2d2; }
  .blob.b2 { width:220px; height:220px; right:-70px; top:120px; background:#ffd7c9; }
  .blob.b3 { width:300px; height:300px; left:40%; bottom:-120px; background:#ffe0e8; }
  /* 氣球：圓角方塊旋轉 45 度 + 兩個圓 */
  .bal { position:absolute; width:var(--s); height:var(--s); background:#fff;
    transform:rotate(-45deg); border-radius:3px 3px 3px 50%;
    box-shadow:-2px 2px 8px rgba(216,150,168,.22); animation:bob 6s ease-in-out infinite; }
  .bal::before, .bal::after { content:''; position:absolute; width:var(--s); height:var(--s);
    background:#fff; border-radius:50%; }
  .bal::before { top:calc(var(--s) / -2); left:0; }
  .bal::after { right:calc(var(--s) / -2); top:0; }
  .str { position:absolute; width:1px; background:rgba(255,255,255,.9); animation:bob 6s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform:translateY(0) rotate(-45deg); } 50% { transform:translateY(-9px) rotate(-45deg); } }
  @keyframes bobs { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-9px); } }
  .str { animation-name:bobs; }
  /* 底部雲層 */
  .cloud { position:absolute; bottom:-30px; background:#fff; border-radius:50%; opacity:.95; }
  .cloud.c1 { width:230px; height:120px; left:-50px; }
  .cloud.c2 { width:180px; height:92px; left:120px; bottom:-44px; }
  .cloud.c3 { width:260px; height:130px; right:-70px; }
  .cloud.c4 { width:150px; height:80px; right:110px; bottom:-40px; }
  /* 飄落花瓣 */
  .pet { position:absolute; width:9px; height:9px; background:rgba(255,255,255,.92);
    border-radius:50% 0 50% 50%; opacity:0; animation:fall linear infinite; }
  @keyframes fall {
    0% { opacity:0; transform:translateY(-20px) rotate(0deg); }
    10% { opacity:.95; }
    90% { opacity:.6; }
    100% { opacity:0; transform:translateY(102vh) rotate(420deg); } }

  /* 固定錨在上方：候選清單展開時版面完全不動，輸入框不可能被推出畫面 */
  #seatInner { position:relative; width:100%; max-width:430px; margin:9vh 0 auto; z-index:1;
    transform-origin:top center; }
  #seat.typing #seatInner, #seat.on #seatInner, #seatInner.top { margin-top:2vh; }
  .seatHead { text-align:center; margin-bottom:26px; transition:margin .4s; cursor:default; }
  .seatHead .hrt { color:#f08ba4; font-size:22px; transition:font-size .4s; }
  .seatHead h1 { font-size:25px; font-weight:400; letter-spacing:4px; margin:8px 0 7px; color:#a4576c;
    transition:font-size .4s, margin .4s; }
  .seatHead p { font-size:13px; color:#c08ea0; letter-spacing:2px; }
  .seatTip { text-align:center; font-size:11px; color:#d0a3b1; letter-spacing:1px; margin-top:18px; }
  #seat.on .seatTip, #seat.typing .seatTip { display:none; }
  #seat.on .seatHead, #seat.typing .seatHead { margin-bottom:12px; }
  #seat.on .seatHead .hrt, #seat.typing .seatHead .hrt { font-size:15px; }
  #seat.on .seatHead h1, #seat.typing .seatHead h1 { font-size:16px; letter-spacing:2px; margin:3px 0 0; color:#c08ea0; }
  #seat.on .seatHead p, #seat.typing .seatHead p { display:none; }
  #seat.on .seatHead { cursor:pointer; }

  .seatBox { position:relative; }
  .seatBox.hidden { display:none; }
  #sq { width:100%; background:rgba(255,255,255,.92); border:1px solid rgba(240,160,185,.55);
    border-radius:999px; padding:16px 20px; font-size:17px; color:#6b4a52; font-family:inherit;
    outline:none; text-align:center; letter-spacing:2px;
    box-shadow:0 6px 20px rgba(214,140,165,.16); transition:border-color .2s, box-shadow .2s; }
  #sq::placeholder { color:#d3a7b4; letter-spacing:1px; }
  #sq:focus { border-color:#ef87a6; box-shadow:0 6px 24px rgba(214,140,165,.26); }
  #sugg { position:absolute; left:0; right:0; top:calc(100% + 10px); background:#fff;
    border:1px solid rgba(240,180,200,.4); border-radius:18px; overflow-y:auto; z-index:5;
    max-height:46vh; -webkit-overflow-scrolling:touch; box-shadow:0 16px 40px rgba(190,120,145,.22); }
  @supports (height:100dvh) { #sugg { max-height:calc(100dvh - 215px); } }
  #sugg.hidden { display:none; }
  .sg { display:flex; align-items:center; gap:10px; padding:13px 18px; cursor:pointer;
    border-bottom:1px solid #fbeef1; font-size:16px; color:#5f4049; }
  .sg:last-child { border-bottom:0; }
  .sg.on, .sg:hover { background:#fff2f5; }
  .sg em { font-style:normal; color:#c6a3ae; font-size:12px; margin-left:auto; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; max-width:45%; }
  .sg i { font-style:normal; color:#e0708f; font-weight:600; }
  .sgNone { padding:20px; text-align:center; color:#c6a3ae; font-size:14px; line-height:1.9; }
  .spGo { display:block; margin:14px auto 0; background:linear-gradient(100deg,#e3879f,#c96e88);
    border:0; color:#fff; border-radius:999px; padding:10px 20px; font-size:14px;
    font-family:inherit; cursor:pointer; box-shadow:0 6px 16px rgba(201,110,136,.28); }
  .spGo:active { transform:scale(.97); }

  #stage.hidden { display:none; }
  .stName { text-align:center; font-size:29px; letter-spacing:5px; color:#8e4a60;
    opacity:0; transform:translateY(14px); animation:stIn .9s .1s forwards cubic-bezier(.2,.7,.3,1); }
  .stLead { text-align:center; font-size:11px; color:#c08ea0; letter-spacing:4px; margin-top:9px;
    opacity:0; animation:stIn .8s .5s forwards; }
  .stCard { margin:16px auto 0; text-align:center; padding:20px 16px 18px; border-radius:22px;
    background:rgba(255,255,255,.92); border:1px solid rgba(240,180,200,.5);
    box-shadow:0 10px 30px rgba(200,130,155,.16); opacity:0; transform:scale(.93);
    animation:stPop .85s 1s forwards cubic-bezier(.2,.9,.3,1.1); }
  .stCard .lab { font-size:11px; letter-spacing:6px; color:#cfa3b1; }
  .stCard .tnum { font-size:46px; font-weight:500; letter-spacing:3px; margin:10px 0 2px; line-height:1.15;
    background:linear-gradient(100deg,#b4607a,#d98aa0,#a4576c); -webkit-background-clip:text;
    background-clip:text; color:transparent; }
  .stCard .tpos { display:inline-block; margin-top:10px; font-size:12px; color:#fff;
    background:linear-gradient(100deg,#e3879f,#c96e88); border-radius:999px; padding:4px 14px;
    letter-spacing:1px; box-shadow:0 4px 12px rgba(201,110,136,.3); }
  .mateWrap { position:relative; display:flex; justify-content:center; margin-top:14px; }
  .mateTog { background:rgba(255,255,255,.85);
    border:1px solid rgba(240,180,200,.55); color:#a4576c; border-radius:999px;
    padding:8px 18px; font-size:13px; font-family:inherit; cursor:pointer;
    opacity:0; animation:stIn .7s 2.9s forwards; }
  .mateTog i { font-style:normal; display:inline-block; transition:transform .25s; margin-left:4px; }
  .mateTog.open i { transform:rotate(180deg); }
  /* 同桌名單：從按鈕上方彈出的對話泡泡，不影響版面高度 */
  .stMates { position:absolute; left:50%; bottom:calc(100% + 13px); z-index:4;
    width:min(92vw, 340px); padding:14px; background:#fff;
    border:1px solid rgba(240,180,200,.55); border-radius:18px;
    box-shadow:0 16px 36px rgba(190,120,145,.28);
    opacity:0; pointer-events:none; transform:translateX(-50%) translateY(8px) scale(.96);
    transition:opacity .2s, transform .22s cubic-bezier(.2,.8,.3,1.1); }
  .stMates.open { opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0) scale(1); }
  .stMates::after { content:''; position:absolute; left:50%; bottom:-8px; width:15px; height:15px;
    background:#fff; transform:translateX(-50%) rotate(45deg);
    border-right:1px solid rgba(240,180,200,.55); border-bottom:1px solid rgba(240,180,200,.55);
    border-radius:0 0 4px 0; }
  .mtin { display:flex; flex-wrap:wrap; gap:7px; justify-content:center;
    max-height:38vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .stMates span.mt { background:#fff6f8; border:1px solid rgba(240,180,200,.55);
    color:#8a6672; border-radius:999px; padding:5px 12px; font-size:13px; }
  @keyframes stIn { to { opacity:1; transform:none; } }
  @keyframes stPop { to { opacity:1; transform:none; } }

  #mapWrap { position:relative; margin:14px auto 0; padding:12px 10px 8px; border-radius:18px;
    background:rgba(255,255,255,.75); border:1px solid rgba(240,180,200,.4);
    box-shadow:0 8px 24px rgba(200,130,155,.12);
    opacity:0; animation:stIn .8s 1.4s forwards; overflow-x:auto; }
  #mapInner { position:relative; width:max-content; margin:0 auto; }
  #beam { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
  .mStage { text-align:center; font-size:10px; color:#c6a3ae; border:1px solid rgba(240,180,200,.55);
    border-radius:6px; padding:3px; margin-bottom:8px; letter-spacing:3px; }
  .mCols { display:flex; justify-content:center; gap:7px; }
  .mGroup { display:flex; gap:7px; }
  .mGroup.pad { padding-top:31px; }
  .mWrap { display:flex; flex-direction:column; align-items:center; }
  .mWrap.hp { padding-top:31px; }
  .mCol { display:flex; flex-direction:column; gap:6px; align-items:center; }
  .mCol.sp { justify-content:space-between; }
  .md { width:25px; height:25px; border-radius:50%; border:1px solid #f0d2dc; background:#fff; }
  .md.occ { background:#fbe6ec; border-color:#f0c3d1; }
  .md.me { background:radial-gradient(circle,#ffb3c8,#cf5a79); border:3px solid #fff;
    animation:mePulse 1.7s 2.7s infinite cubic-bezier(.3,.7,.4,1); }
  @keyframes mePulse {
    0% { box-shadow:0 0 0 0 rgba(207,90,121,.6), 0 0 14px 3px rgba(207,90,121,.45); }
    70% { box-shadow:0 0 0 20px rgba(207,90,121,0), 0 0 24px 8px rgba(207,90,121,.2); }
    100% { box-shadow:0 0 0 0 rgba(207,90,121,0), 0 0 14px 3px rgba(207,90,121,.4); } }
  .mAisle { width:16px; border-radius:6px; background:linear-gradient(180deg,#fdeef2,#fbe3ea); }
  .mEnt { text-align:center; font-size:10px; color:#c6a3ae; margin-top:7px; letter-spacing:3px; }
  .seatNote { text-align:center; font-size:14px; color:#a4576c; margin-top:20px; line-height:2; }
  @media (prefers-reduced-motion: reduce) {
    .bal, .str, .pet, .md.me { animation:none; }
    .stName, .stLead, .stCard, #mapWrap, .stMates { animation-duration:.01s; animation-delay:0s; }
  }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#2d2a28; color:#fff;
    padding:10px 18px; border-radius:999px; font-size:13px; z-index:40; max-width:90vw; text-align:center; }
  .tcard { background:#fff; border-radius:18px; padding:18px; width:100%; max-width:360px; max-height:70vh; overflow-y:auto; }
  .tcard h3 { font-size:16px; display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .tclose { margin:12px auto 0; display:block; border:1px solid #d6d3d1; background:#fff; color:#78716c; border-radius:999px; padding:6px 24px; font-size:13px; cursor:pointer; }
  /* 手機優化 */
  @media (max-width: 480px) {

function lsGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }

function b64(s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }

/** 用帶位金鑰解開精簡資料（與密碼那份完全獨立） */
function decryptWith(blob, secret) {
  return Promise.resolve().then(function () {
    if (!window.crypto || !crypto.subtle) { var e = new Error('no-subtle'); e.noCrypto = true; throw e; }
    return crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveKey']);
  })
    .then(function (base) {
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64(blob.salt), iterations: blob.iters, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    })
    .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(blob.iv) }, key, b64(blob.ct)); })
    .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
}

function tryDecrypt(password) {
  // 以 Promise 包裝，讓「crypto.subtle 不存在」等同步例外也走 reject，不會靜默失敗
  return Promise.resolve().then(function () {
    if (!window.crypto || !crypto.subtle) { var e = new Error('no-subtle'); e.noCrypto = true; throw e; }
    return crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  })
    .then(function (base) {
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64(ENC.salt), iterations: ENC.iters, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    })
    .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(ENC.iv) }, key, b64(ENC.ct)); })
    .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
}

    try { sessionStorage.setItem('wsm.pub.pw', pw); } catch (_) {}

  }).then(null, function (ex) {

      err.textContent = I18N[lang].lockErr;

function toast(msg) {
  var old = document.getElementById('toast');
  if (old) old.remove();
  var el = document.createElement('div');
  el.id = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function () { if (el.parentNode) el.remove(); }, 3200);
}

function copyText(str) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(str);
  }
  // 舊瀏覽器／App 內建瀏覽器的退路
  return new Promise(function (resolve, reject) {
    var ta = document.createElement('textarea');
    ta.value = str;
    ta.style.cssText = 'position:fixed;top:-1000px;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    ok ? resolve() : reject(new Error('execCommand failed'));
  });
}

/** 把內嵌的 SVG QR 轉成 1024px PNG 下載 */
function saveQr() {
  var t = I18N[lang];
  var btn = document.getElementById('qrSaveBtn');
  var svg = document.querySelector('#qcard svg');
  if (!svg) return;
  var orig = btn.textContent;
  btn.textContent = t.qrSaving;
  btn.disabled = true;

  var SIZE = 1024;
  var src = new XMLSerializer().serializeToString(svg);
  if (src.indexOf('xmlns=') === -1) src = src.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
  var url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src);

  function done() { btn.textContent = orig; btn.disabled = false; }

  var img = new Image();
  img.onload = function () {
    try {
      var cv = document.createElement('canvas');
      cv.width = SIZE; cv.height = SIZE;
      var cx = cv.getContext('2d');
      cx.fillStyle = '#ffffff';
      cx.fillRect(0, 0, SIZE, SIZE);
      cx.imageSmoothingEnabled = false;
      cx.drawImage(img, 0, 0, SIZE, SIZE);
      var png = cv.toDataURL('image/png');
      var a = document.createElement('a');
      a.href = png;
      a.download = 'wedding-seat-qr.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
    } catch (e) {
      window.open(url, '_blank');
      toast(t.qrSaveFail);
    }
    done();
  };
  img.onerror = function () { window.open(url, '_blank'); toast(t.qrSaveFail); done(); };
  img.src = url;
}

/* 打一個字就跳候選 */
function seatSuggest() {
  var t = I18N[lang];
  var kw = document.getElementById('sq').value.trim().toLowerCase();
  var box = document.getElementById('sugg');
  if (kw) document.getElementById('seat').classList.add('typing');
  if (!kw) {
    box.classList.add('hidden'); box.innerHTML = ''; sgList = []; sgSel = -1;
    fitSuggest();
    return;
  }

  var dup = {};
  var ids = Object.keys(GUESTS);
  var hits = [];
  for (var i = 0; i < ids.length; i++) {
    var g = GUESTS[ids[i]].g;
    var p = g.n.toLowerCase().indexOf(kw);
    if (p === -1) continue;
    hits.push({ id: ids[i], pos: p });
    dup[g.n] = (dup[g.n] || 0) + 1;
  }
  hits.sort(function (a, b) {
    if (a.pos !== b.pos) return a.pos - b.pos;
    return GUESTS[a.id].g.n.length - GUESTS[b.id].g.n.length;
  });
  hits = hits.slice(0, 40);
  sgList = hits; sgSel = -1;

  if (!hits.length) {
    var sp = DATA.sp;
    var typed = document.getElementById('sq').value.replace(/[s　]+/g, '').slice(0, 12);
    box.innerHTML = '<div class="sgNone">' + t.seatNone
      + (sp
          ? '<button type="button" class="spGo" id="spGo">'
            + t.seatSpareGo.replace('{n}', escHtml(typed)) + '&#8594;</button>'
          : '')
      + '</div>';
    box.classList.remove('hidden');
    var sg = document.getElementById('spGo');
    if (sg) sg.onclick = function () { seatSpare(typed); };
    fitSuggest();
    return;
  }
  var html = '';
  for (var k = 0; k < hits.length; k++) {
    var rec = GUESTS[hits[k].id], gg = rec.g, pos = hits[k].pos;
    var nm = escHtml(gg.n.slice(0, pos)) + '<i>' + escHtml(gg.n.slice(pos, pos + kw.length)) + '</i>'
      + escHtml(gg.n.slice(pos + kw.length));
    var hint = '';
    // 同名時用桌號區分；查不到桌號就不顯示提示（避免露出「尚未安排」）
    if (dup[gg.n] > 1) hint = rec.tb && rec.tb.p ? rec.tb.p + ' ' + t.seatTbl : '';
    if (!hint && gg.r) hint = gg.r;
    if (!hint && gg.o) hint = gg.o;
    html += '<div class="sg" data-id="' + hits[k].id + '"><span>' + nm + '</span>'
      + (hint ? '<em>' + escHtml(hint) + '</em>' : '') + '</div>';
  }
  box.innerHTML = html;
  box.classList.remove('hidden');
  fitSuggest();
}

/* 一束光從入口流到你的桌子 */
function drawBeam() {
  var inner = document.getElementById('mapInner');
  var svg = document.getElementById('beam');
  var me = inner ? inner.querySelector('.md.me') : null;
  var aisle = inner ? inner.querySelector('.mAisle') : null;
  if (!inner || !svg || !me || !aisle) return;
  var wr = inner.getBoundingClientRect(), mr = me.getBoundingClientRect(), ar = aisle.getBoundingClientRect();
  var W = inner.offsetWidth, H = inner.offsetHeight;
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  var tx = mr.left - wr.left + mr.width / 2, ty = mr.top - wr.top + mr.height / 2;
  var ax = ar.left - wr.left + ar.width / 2;
  var sy = H - 14;
  var d = 'M ' + ax + ' ' + sy + ' L ' + ax + ' ' + (ty + 14) + ' Q ' + ax + ' ' + ty + ' '
    + (ax + (tx > ax ? 14 : -14)) + ' ' + ty + ' L ' + tx + ' ' + ty;
  svg.innerHTML =
    '<defs><linearGradient id="bg1" x1="0" y1="1" x2="0" y2="0">'
    + '<stop offset="0%" stop-color="#f5c2d2" stop-opacity=".3"/>'
    + '<stop offset="60%" stop-color="#e9a0b7" stop-opacity=".8"/>'
    + '<stop offset="100%" stop-color="#d8809a"/></linearGradient>'
    + '<filter id="bglow" x="-60%" y="-60%" width="220%" height="220%">'
    + '<feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/>'
    + '<feMergeNode in="SourceGraphic"/></feMerge></filter></defs>'
    // 底線：先一次畫出來，之後常駐
    + '<path id="bpath" d="' + d + '" fill="none" stroke="url(#bg1)" stroke-width="2.4" '
    + 'stroke-linecap="round" opacity=".55"/>'
    + '<circle id="bdot" r="5" fill="#fff" stroke="#c9566f" stroke-width="1.6" '
    + 'filter="url(#bglow)" opacity="0">'
    + '<animateMotion dur="2.2s" begin="2.6s" repeatCount="indefinite" rotate="auto">'
    + '<mpath href="#bpath"/></animateMotion></circle>';

  var path = svg.querySelector('#bpath');
  var dot = svg.querySelector('#bdot');
  var len = path.getTotalLength();

  path.style.strokeDasharray = len;
  path.style.strokeDashoffset = len;

  if (path.animate) {
    // 先把路線畫出來，接著一顆光點沿路線不斷來回指引
    path.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
      { duration: 1300, delay: 1400, fill: 'forwards', easing: 'cubic-bezier(.4,.1,.2,1)' });
    dot.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 2600, fill: 'forwards' });
  } else {
    path.style.transition = 'stroke-dashoffset 1.3s cubic-bezier(.4,.1,.2,1) 1.4s';
    void path.getBoundingClientRect();
    path.style.strokeDashoffset = 0;
    dot.setAttribute('opacity', '1');
  }
}

/* 結果內容若高於一頁，等比縮小塞進去（維持「不需要捲動」） */
function fitStage() {
  var inner = document.getElementById('seatInner');
  if (!inner) return;
  inner.classList.remove('top');
  inner.style.transform = '';
  var avail = viewH() - 40;
  var h = inner.offsetHeight;
  if (h > avail) {
    inner.classList.add('top');
    inner.style.transform = 'scale(' + Math.max(0.62, avail / h).toFixed(3) + ')';
  }
}

/**
 * 名單上查不到（或還沒排到座位）時用的備用座位。
 * 刻意與一般查詢結果長得一模一樣——不出現「預備／尚未安排」字樣，
 * 賓客不會察覺自己是漏排的，也不會覺得被當成次要客人。
 */
function seatSpare(who) {
  var t = I18N[lang], sp = DATA.sp;
  if (!sp) return;
  document.getElementById('sugg').classList.add('hidden');
  document.getElementById('seatBox').classList.add('hidden');
  document.getElementById('seat').classList.add('on');
  document.getElementById('seat').classList.remove('typing');
  var stage = document.getElementById('stage');
  stage.classList.remove('hidden');
  var label = sp === '主桌' ? sp : sp + ' ' + t.seatTbl;
  stage.innerHTML = '<div class="stName">' + escHtml(who || t.seatSpareHead) + '</div>'
    + '<div class="stLead">' + t.seatLead + '</div>'
    + '<div class="stCard"><div class="lab">' + t.seatLab + '</div>'
    + '<div class="tnum">' + escHtml(label) + '</div></div>'
    + miniFloor(sp)
    + '<p class="seatNote" style="font-size:12px;margin-top:12px">' + t.seatSpareNote + '</p>';
  setTimeout(drawBeam, 120);
  setTimeout(fitStage, 60);
}

function seatPick(id) {
  var rec = GUESTS[id];
  if (!rec) return;
  var t = I18N[lang], g = rec.g, tb = rec.tb;
  document.getElementById('sugg').classList.add('hidden');
  document.getElementById('seatBox').classList.add('hidden');
  var stage = document.getElementById('stage');
  stage.classList.remove('hidden');

  var head = '<div class="stName">' + escHtml(g.n) + '</div>';

  document.getElementById('seat').classList.add('on');
  document.getElementById('seat').classList.remove('typing');

  if (!tb) {
    // 名單上有這個人、卻還沒排到座位：直接給備用座位，畫面與一般結果一致
    if (DATA.sp) { seatSpare(g.n); return; }
    stage.innerHTML = head + '<p class="seatNote">' + t.seatUn + '</p>';
  } else {
    var mates = tb.g.filter(function (x) { return x.n !== g.n; }).map(function (x) { return x.n; });
    // 只對賓客顯示場地位置代號，不顯示內部桌名
    var label = tb.p ? (tb.p === '主桌' ? tb.p : tb.p + ' ' + t.seatTbl) : '';
    var card = '<div class="stCard"><div class="lab">' + t.seatLab + '</div>'
      + (label ? '<div class="tnum">' + escHtml(label) + '</div>' : '')
      + '</div>';
    stage.innerHTML = head + '<div class="stLead">' + t.seatLead + '</div>'
      + (tb.p ? card + miniFloor(tb.p) : '<p class="seatNote">' + t.seatNoPos + '</p>')
      + (mates.length
        ? '<div class="mateWrap">'
          + '<button type="button" class="mateTog" id="mateTog">'
          + t.seatMates.replace('{n}', mates.length) + '<i>&#9662;</i></button>'
          + '<div class="stMates" id="mates"><div class="mtin">'
          + mates.map(function (m) { return '<span class="mt">' + escHtml(m) + '</span>'; }).join('')
          + '</div></div></div>'
        : '');
    if (tb.p) setTimeout(drawBeam, 120);
    var tog = document.getElementById('mateTog');
    if (tog) tog.onclick = function (e) {
      e.stopPropagation();
      var box = document.getElementById('mates');
      var open = box.classList.toggle('open');
      tog.classList.toggle('open', open);
    };
  }
  document.getElementById('seat').scrollTop = 0;
  // 版面定了之後再量一次，必要時縮小塞進一頁
  setTimeout(fitStage, 60);
}

(function () {
  var sq = document.getElementById('sq');
  sq.addEventListener('focus', function () { document.getElementById('seat').classList.add('typing'); });
  sq.addEventListener('input', seatSuggest);
  sq.addEventListener('keydown', function (e) {
    if (!sgList.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      sgSel = (sgSel + (e.key === 'ArrowDown' ? 1 : -1) + sgList.length) % sgList.length;
      var items = document.querySelectorAll('#sugg .sg');
      for (var i = 0; i < items.length; i++) items[i].classList.toggle('on', i === sgSel);
      if (items[sgSel]) items[sgSel].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      seatPick(sgList[sgSel >= 0 ? sgSel : 0].id);
    }
  });
  document.getElementById('sugg').addEventListener('click', function (e) {
    var row = e.target.closest ? e.target.closest('.sg') : null;
    if (row) seatPick(row.getAttribute('data-id'));
  });
})();

/* ---------- 賓客索引與 chip ---------- */
var GUESTS = {};
function indexGuests() {
  GUESTS = {};
  (DATA.t || []).forEach(function (tb, ti) {
    tb.g.forEach(function (g, gi) {
      var id = 't' + ti + '_' + gi;
      g.__id = id;
      GUESTS[id] = { g: g, tb: tb };
    });
  });
  (DATA.u || []).forEach(function (g, i) {
    var id = 'u' + i;
    g.__id = id;
    GUESTS[id] = { g: g, tb: null };
  });
}

function chipHtml(g, kw, extraAttr) {
  var hit = kw && g.n.toLowerCase().indexOf(kw) !== -1;
  return '<span class="chip' + (hit ? ' hit' : '') + '" data-g="' + g.__id + '"' + (extraAttr || '') + '>'
    + '<span class="dot ' + g.s + '"></span><span class="nm">' + escHtml(g.n) + '</span></span>';
}

/* 長按（手機）／右鍵（電腦）→ 賓客詳細資料 */
function openGuest(id) {
  var rec = GUESTS[id];
  if (!rec) return;
  var t = I18N[lang], g = rec.g, tb = rec.tb;
  var rows = [[t.dTable, tb ? (tb.p ? tb.p + '　' : '') + tb.n : t.dUnseated],
              [t.dSide, (t.sideMap && t.sideMap[g.s]) || g.s]];
  if (g.r) rows.push([t.dGroup, g.r]);
  if (g.o) rows.push([t.dNote, g.o]);
  var needs = [];
  if (g.v) needs.push('🥬 ' + t.dVeg);
  if (g.k) needs.push('👶 ' + t.dKid);
  if (g.t) needs.push('❗ ' + t.dTent);
  if (needs.length) rows.push([t.dNeeds, needs.join('　')]);
  document.getElementById('gcard').innerHTML =
    '<h3>' + escHtml(g.n) + '</h3>'
    + '<dl class="kv">' + rows.map(function (r) {
        return '<dt>' + escHtml(r[0]) + '</dt><dd>' + escHtml(r[1]) + '</dd>';
      }).join('') + '</dl>'
    + '<button type="button" class="tclose" id="gcloseBtn">' + t.close + '</button>';
  document.getElementById('gmodal').classList.remove('hidden');
}

document.getElementById('gmodal').addEventListener('click', function (e) {
  if (e.target.id === 'gmodal' || e.target.id === 'gcloseBtn') {
    document.getElementById('gmodal').classList.add('hidden');
  }
});

document.addEventListener('contextmenu', function (e) {
  var chip = e.target.closest ? e.target.closest('.chip[data-g]') : null;
  if (!chip) return;
  e.preventDefault();
  openGuest(chip.getAttribute('data-g'));
});

var lpTimer = null, lpFired = false;
document.addEventListener('touchstart', function (e) {
  var chip = e.target.closest ? e.target.closest('.chip[data-g]') : null;
  if (!chip) return;
  lpFired = false;
  var id = chip.getAttribute('data-g');
  lpTimer = setTimeout(function () {
    lpTimer = null;
    lpFired = true;
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (err) {} }
    openGuest(id);
  }, 500);
}, { passive: true });
['touchend', 'touchmove', 'touchcancel', 'scroll'].forEach(function (ev) {
  document.addEventListener(ev, function () {
    if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
  }, { passive: true });
});
// 長按後瀏覽器仍會補一次 click，吃掉它
document.addEventListener('click', function (e) {
  if (lpFired) { lpFired = false; e.preventDefault(); e.stopPropagation(); }
}, true);

/* ---------- 名單檢視 ---------- */
function renderList(kw) {
  var t = I18N[lang];
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  DATA.t.forEach(function (tb) {
    var hits = tb.g.filter(function (g) { return kw && g.n.toLowerCase().indexOf(kw) !== -1; });
    var card = document.createElement('div');
    card.className = 'card' + (hits.length ? ' hit' : kw ? ' dim' : '');
    var shape = tb.s === 'ROUND' ? '⭕' : '▭';
    var chips = tb.g.map(function (g) { return chipHtml(g, kw); }).join('');
    var posBadge = tb.p ? ' <span class="pos">' + escHtml(tb.p) + '</span>' : '';
    card.innerHTML = '<h3>' + shape + ' ' + escHtml(tb.n) + posBadge + ' <span class="cap">' + tb.g.length + '/' + tb.c + '</span></h3><div class="chips">' + chips + '</div>';
    grid.appendChild(card);
  });
}

/* ---------- 未安排名單檢視 ---------- */
function renderUnassigned(kw) {
  var t = I18N[lang];
  var grid = document.getElementById('ungrid');
  var list = DATA.u || [];
  if (!list.length) {
    grid.innerHTML = '<div class="card" style="grid-column:1/-1;text-align:center;color:#a8a29e">' + t.unEmpty + '</div>';
    return;
  }
  var chips = list.map(function (g) {
    var hit = kw && g.n.toLowerCase().indexOf(kw) !== -1;
    return chipHtml(g, kw, kw && !hit ? ' style="opacity:.35"' : '');
  }).join('');
  grid.innerHTML = '<div class="card" style="grid-column:1/-1">'
    + '<h3>📋 ' + t.unTitle + ' <span class="cap">' + list.length + '</span></h3>'
    + '<div class="chips">' + chips + '</div></div>';
}

/* ---------- 平面圖檢視（唯讀） ---------- */
var posMap = null;
function buildPosMap() {
  posMap = {};
  DATA.t.forEach(function (tb) { if (tb.p) posMap[tb.p] = tb; });
}

function circleHtml(code, kw) {
  var tb = posMap[code];
  if (!tb) return '<button type="button" class="pc empty" tabindex="-1"><span class="pcode">' + escHtml(code) + '</span></button>';
  var hit = kw && tb.g.some(function (g) { return g.n.toLowerCase().indexOf(kw) !== -1; });
  var cls = 'pc occ' + (code === '主桌' ? ' main' : '') + (hit ? ' hitc' : kw ? ' dimc' : '');
  return '<button type="button" class="' + cls + '" data-code="' + escHtml(code) + '">'
    + '<span class="pcode">' + escHtml(code) + '</span>'
    + '<span class="pname">' + escHtml(tb.n) + '</span>'
    + '<span>' + tb.g.length + '/' + tb.c + '</span></button>';
}

function colHtml(col, kw, groupHasHead) {
  var id = col[0], nums = col[1], head = col[2], spread = col[3];
  // 圓圈 48px、間距 8px → 散開時固定高度，讓少桌的排與配置圖一樣交錯
  var style = spread ? ' style="min-height:' + (spread * 48 + (spread - 1) * 8) + 'px"' : '';
  // 同組中有主桌、自己沒有 → 補一格空位，讓第一排桌子彼此對齊
  var pad = groupHasHead && !head ? ' headpad' : '';
  var html = '<div class="vcolwrap' + pad + '"><div class="vcol' + (spread ? ' sp' : '') + '"' + style + '>';
  if (head) html += circleHtml('主桌', kw);
  for (var i = 0; i < nums.length; i++) html += circleHtml(id + '-' + nums[i], kw);
  return html + '</div></div>';
}

function renderFloor(kw) {
  var t = I18N[lang];
  document.getElementById('lbStage').textContent = t.stage + ' 960×300';
  document.getElementById('lbStairs').textContent = t.stairs;
  document.getElementById('lbFoodL').textContent = t.foodExit;
  document.getElementById('lbFoodR').textContent = t.foodExit;
  document.getElementById('entrances').innerHTML =
    '<span>▲ ' + t.entrance + '</span><span>▲ ' + t.entrance + '</span><span>▲ ' + t.entrance + '</span><span>' + t.reception + '</span>';
  var lHead = VENUE.left.some(function (c) { return c[2]; });
  var rHead = VENUE.right.some(function (c) { return c[2]; });
  var left = '<div class="cgroup leftpad">' + VENUE.left.map(function (c) { return colHtml(c, kw, lHead); }).join('') + '</div>';
  var right = '<div class="cgroup">' + VENUE.right.map(function (c) { return colHtml(c, kw, rHead); }).join('') + '</div>';
  document.getElementById('floorCols').innerHTML =
    left + '<div class="aisle"><span>' + t.walkway + '</span></div>' + right;
}

/* 點桌位圓圈 → 唯讀名單彈窗 */
document.getElementById('floor').addEventListener('click', function (e) {
  var btn = e.target.closest ? e.target.closest('.pc.occ') : null;
  if (!btn) return;
  var tb = posMap[btn.getAttribute('data-code')];
  if (!tb) return;
  var t = I18N[lang];
  var kw = q.value.trim().toLowerCase();
  var chips = tb.g.map(function (g) { return chipHtml(g, kw); }).join('');
  document.getElementById('tcard').innerHTML =
    '<h3><span class="pos">' + escHtml(tb.p) + '</span> ' + escHtml(tb.n) + ' <span class="cap">' + tb.g.length + '/' + tb.c + '</span></h3>'
    + '<div class="chips">' + chips + '</div>'
    + '<button type="button" class="tclose" id="tcloseBtn">' + t.close + '</button>';
  document.getElementById('tmodal').classList.remove('hidden');
});
document.getElementById('tmodal').addEventListener('click', function (e) {
  if (e.target.id === 'tmodal' || e.target.id === 'tcloseBtn') {
    document.getElementById('tmodal').classList.add('hidden');
  }
});

/* ---------- 主渲染 ---------- */
function render() {
  if (!DATA) return;
  var t = I18N[lang];
  buildPosMap();
  document.getElementById('wname').textContent = DATA.w;
  document.querySelector('[data-i18n=title]').textContent = t.title;
  document.getElementById('langBtn').textContent = t.lang;
  q.placeholder = t.hint;
  var vList = document.getElementById('vList');
  var vFloor = document.getElementById('vFloor');
  var vUn = document.getElementById('vUn');
  vList.textContent = t.viewList;
  vFloor.textContent = t.viewFloor;
  vUn.textContent = t.viewUn + '（' + ((DATA.u || []).length) + '）';
  vList.className = 'vbtn' + (view === 'list' ? ' active' : '');
  vFloor.className = 'vbtn' + (view === 'floor' ? ' active' : '');
  vUn.className = 'vbtn' + (view === 'un' ? ' active' : '');

  var kw = q.value.trim().toLowerCase();
  var hitTables = [];
  var totalGuests = 0;
  DATA.t.forEach(function (tb) {
    totalGuests += tb.g.length;
    if (kw && tb.g.some(function (g) { return g.n.toLowerCase().indexOf(kw) !== -1; })) {
      hitTables.push(tb.n + (tb.p ? '（' + tb.p + '）' : ''));
    }
  });
  var unHit = kw && (DATA.u || []).some(function (g) { return g.n.toLowerCase().indexOf(kw) !== -1; });
  document.getElementById('found').textContent = hitTables.length
    ? t.found + hitTables.join('、')
    : (unHit ? t.unTitle : '');

  // 統計列
  var unseated = (DATA.u || []).length;
  var all = totalGuests + unseated;
  var seats = DATA.t.reduce(function (n, tb) { return n + tb.c; }, 0);
  var stats = [
    [all, t.stTotal], [totalGuests, t.stSeated], [unseated, t.stUnseated],
    [DATA.t.length, t.stTables], [seats, t.stSeats],
  ];
  document.getElementById('statsRow').innerHTML = stats.map(function (p) {
    return '<div class="stat"><b>' + p[0] + '</b><span>' + p[1] + '</span></div>';
  }).join('');
  document.getElementById('progressBar').style.width = (all ? Math.round((totalGuests / all) * 100) : 0) + '%';

  var sw = document.getElementById('shareWrap');
  sw.classList.toggle('hidden', !DATA.sh && !(QR && QR.s));
  document.getElementById('shareBtn').classList.toggle('hidden', !DATA.sh);
  document.getElementById('shareBtn').textContent = t.shareBtn;
  document.getElementById('qrBtn').textContent = t.qrBtn;
  document.getElementById('qrBtn').classList.toggle('hidden', !(QR && QR.s));

  var gh = document.getElementById('ghint');
  gh.textContent = t.gHint;
  gh.classList.toggle('hidden', view === 'floor');

  document.getElementById('grid').classList.toggle('hidden', view !== 'list');
  document.getElementById('ungrid').classList.toggle('hidden', view !== 'un');
  document.getElementById('floor').classList.toggle('hidden', view !== 'floor');
  if (view === 'list') renderList(kw);
  else if (view === 'un') renderUnassigned(kw);
  else renderFloor(kw);

  document.getElementById('foot').textContent = t.stats.replace('{t}', DATA.t.length).replace('{g}', totalGuests)
    + ' · ' + new Date(DATA.generated).toLocaleString(lang === 'zh' ? 'zh-TW' : 'en-US');
}

q.addEventListener('input', render);
document.getElementById('langBtn').addEventListener('click', function () {
  lang = lang === 'zh' ? 'en' : 'zh';
  lsSet('wsm.pub.lang', lang);
  render();
});
document.getElementById('vList').addEventListener('click', function () { view = 'list'; lsSet('wsm.pub.view', view); render(); });
document.getElementById('vFloor').addEventListener('click', function () { view = 'floor'; lsSet('wsm.pub.view', view); render(); });
document.getElementById('vUn').addEventListener('click', function () { view = 'un'; lsSet('wsm.pub.view', view); render(); });

renderLock();
// 同一瀏覽器分頁重整免重輸密碼（部分 App 內瀏覽器禁用 sessionStorage，須容錯）
try {
  var sh = seatHash();
  if (sh && sh.key) {
    decryptWith(ENC_SEAT, sh.key).then(function (d) {
      DATA = d;
      indexGuests();
      buildPosMap();
      document.getElementById('lock').classList.add('hidden');
      enterSeatMode();
    }).then(null, function () {
      // QR 金鑰不對 → 退回正常的密碼畫面
      document.documentElement.className = '';
      document.getElementById('seat').classList.add('hidden');
    });
  }
  // 帶位模式只用金鑰那份精簡資料，不要同時把完整座位表也解開
  var saved = sh && sh.key ? null : sessionStorage.getItem('wsm.pub.pw');
  if (saved) tryDecrypt(saved).then(unlock).then(null, function () { try { sessionStorage.removeItem('wsm.pub.pw'); } catch (_) {} });
} catch (_) {}
</script>
