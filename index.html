<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>婚宴座位表 Seating Chart</title>
<style>
  :root { --rose:#b76e79; --rose-dark:#96525d; --rose-light:#f6e7e9; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; background:#faf7f5; color:#2d2a28; padding:16px; }
  .wrap { max-width:960px; margin:0 auto; }
  header { text-align:center; margin-bottom:16px; }
  .heart { color:var(--rose); font-size:26px; }
  h1 { font-size:22px; margin:4px 0 2px; }
  .sub { color:#a8a29e; font-size:14px; }
  .lang { background:none; border:none; color:#a8a29e; text-decoration:underline; cursor:pointer; font-size:12px; margin-top:4px; }
  .searchbox { max-width:420px; margin:0 auto 12px; position:relative; }
  .searchbox input { width:100%; padding:10px 16px 10px 38px; border-radius:999px; border:1px solid #d6d3d1; font-size:15px; outline:none; background:#fff; }
  .searchbox input:focus { border-color:var(--rose); }
  .searchbox svg { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:#a8a29e; }
  .viewtoggle { display:flex; justify-content:center; margin-bottom:10px; }
  .vbtn { border:1px solid #d6d3d1; background:#fff; padding:8px 16px; font-size:13px; color:#78716c; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .vbtn:first-child { border-radius:999px 0 0 999px; }
  .vbtn:not(:last-child) { border-right:none; }
  .vbtn:last-child { border-radius:0 999px 999px 0; }
  .vbtn.active { background:var(--rose); border-color:var(--rose); color:#fff; }
  .found { text-align:center; color:var(--rose-dark); font-size:15px; margin-bottom:12px; min-height:22px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
  /* 統計列 */
  .stats { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:12px; }
  .stat { background:#fff; border-radius:14px; padding:8px 14px; min-width:74px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .stat b { display:block; font-size:19px; color:var(--rose-dark); line-height:1.2; }
  .stat span { font-size:11px; color:#a8a29e; }
  .bar { max-width:420px; margin:0 auto 14px; height:7px; border-radius:999px; background:#eee7e4; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--rose); border-radius:999px; transition:width .4s; }
  .scrollhint { text-align:center; font-size:11px; color:#a8a29e; margin-bottom:6px; }
  .card { background:#fff; border:2px solid transparent; border-radius:18px; padding:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .card.hit { border-color:var(--rose); }
  .card.dim { opacity:.45; }
  .card h3 { font-size:16px; display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .cap { font-size:12px; background:#f5f5f4; color:#57534e; border-radius:999px; padding:2px 8px; font-weight:normal; }
  .pos { font-size:11px; background:var(--rose-light); color:var(--rose-dark); border-radius:999px; padding:2px 8px; font-weight:normal; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid #e7e5e4; background:#fafaf9; color:#57534e; border-radius:999px; padding:3px 10px; font-size:14px; display:inline-flex; align-items:center; gap:6px; }
  .chip .dot { width:7px; height:7px; border-radius:50%; display:inline-block; flex-shrink:0; }
  .dot.GROOM { background:#4f7cc0; } .dot.BRIDE { background:#d783a0; } .dot.BOTH { background:#a8a29e; }
  .chip.hit { border-color:var(--rose); background:var(--rose-light); color:var(--rose-dark); font-weight:600; }
  footer { text-align:center; color:#d6d3d1; font-size:12px; margin-top:20px; padding-bottom:12px; }
  /* !important：確保能蓋過 #lock（ID 選擇器）的 display:flex */
  .hidden { display:none !important; }
  /* 平面圖 */
  .floorwrap { background:#fff; border-radius:18px; box-shadow:0 1px 3px rgba(0,0,0,.06); padding:12px; overflow-x:auto; }
  .floorinner { min-width:600px; max-width:720px; margin:0 auto; }
  .stagebar { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .stage { flex:1; border:2px solid #d6d3d1; background:#f5f5f4; border-radius:10px; text-align:center; padding:8px; color:#78716c; font-size:13px; }
  .sidenote { font-size:10px; color:#a8a29e; white-space:nowrap; }
  .floorcols { display:flex; justify-content:center; gap:12px; }
  .cgroup { display:flex; gap:12px; }
  .cgroup.leftpad { padding-top:56px; }
  .vcol { display:flex; flex-direction:column; gap:8px; align-items:center; }
  .pc { width:48px; height:48px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:9px; line-height:1.2; border:2px solid; padding:0; background:none; font-family:inherit; }
  .pc.occ { background:var(--rose); border-color:var(--rose); color:#fff; cursor:pointer; }
  .pc.occ.main { background:var(--rose-dark); border-color:var(--rose-dark); }
  .pc.empty { border-style:dashed; border-color:#e7e5e4; color:#d6d3d1; cursor:default; }
  .pc .pcode { font-weight:600; }
  .pc .pname { max-width:42px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pc.hitc { box-shadow:0 0 0 4px #fcd34d; }
  .pc.dimc { opacity:.35; }
  .aisle { width:30px; align-self:stretch; background:#f5f5f4; border-radius:8px; display:flex; align-items:center; justify-content:center; }
  .aisle span { writing-mode:vertical-lr; font-size:10px; color:#a8a29e; letter-spacing:3px; }
  .entrances { display:flex; justify-content:space-around; align-items:center; border-top:1px solid #e7e5e4; margin-top:12px; padding-top:8px; font-size:10px; color:#a8a29e; }
  /* 桌次名單彈窗（唯讀） */
  #tmodal { position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; padding:16px; z-index:20; }
  .tcard { background:#fff; border-radius:18px; padding:18px; width:100%; max-width:360px; max-height:70vh; overflow-y:auto; }
  .tcard h3 { font-size:16px; display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .tclose { margin:12px auto 0; display:block; border:1px solid #d6d3d1; background:#fff; color:#78716c; border-radius:999px; padding:6px 24px; font-size:13px; cursor:pointer; }
  /* 手機優化 */
  @media (max-width: 480px) {
    body { padding:12px 10px 28px; }
    h1 { font-size:20px; }
    .grid { grid-template-columns:1fr; gap:10px; }
    .card { padding:11px; border-radius:16px; }
    .chip { font-size:15px; padding:5px 12px; }
    .stat { flex:1 1 calc(33.333% - 8px); min-width:0; padding:7px 4px; }
    .stat b { font-size:17px; }
    .vbtn { flex:1; padding:9px 4px; }
    .viewtoggle { margin:0 auto 10px; max-width:420px; }
    .floorwrap { padding:8px; }
  }
  /* 密碼鎖畫面 */
  #lock { position:fixed; inset:0; background:#faf7f5; display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
  .lockcard { background:#fff; border-radius:20px; box-shadow:0 4px 20px rgba(0,0,0,.08); padding:32px 28px; width:100%; max-width:340px; text-align:center; }
  .lockcard .heart { font-size:32px; }
  .lockcard h2 { font-size:18px; margin:8px 0 2px; }
  .lockcard .sub { margin-bottom:16px; }
  .lockcard input { width:100%; padding:10px 14px; border:1px solid #d6d3d1; border-radius:12px; font-size:18px; text-align:center; letter-spacing:6px; outline:none; }
  .lockcard input:focus { border-color:var(--rose); }
  .lockcard button.go { width:100%; margin-top:12px; padding:10px; border:none; border-radius:12px; background:var(--rose); color:#fff; font-size:15px; cursor:pointer; }
  .lockcard button.go:hover { background:var(--rose-dark); }
  .lockerr { color:#dc2626; font-size:13px; min-height:18px; margin-top:8px; }
</style>
</head>
<body>
<div id="lock">
  <form class="lockcard" id="lockForm">
    <div class="heart">❤</div>
    <h2 data-lk="title">婚宴座位表</h2>
    <div class="sub" data-lk="hint">請輸入密碼查看</div>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" autofocus>
    <button class="go" type="submit" data-lk="btn">進入</button>
    <div class="lockerr" id="lockErr"></div>
    <div id="lockDiag" style="color:#a8a29e;font-size:10px;word-break:break-all;margin-top:6px;"></div>
    <button class="lang" type="button" id="lockLang"></button>
  </form>
</div>
<div class="wrap hidden" id="app">
  <header>
    <div class="heart">❤</div>
    <h1 id="wname"></h1>
    <div class="sub" data-i18n="title"></div>
    <button class="lang" id="langBtn"></button>
  </header>
  <div class="searchbox">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" autocomplete="off">
  </div>
  <div class="viewtoggle">
    <button class="vbtn" id="vList" type="button"></button>
    <button class="vbtn" id="vFloor" type="button"></button>
    <button class="vbtn" id="vUn" type="button"></button>
  </div>
  <div class="stats" id="statsRow"></div>
  <div class="bar"><i id="progressBar"></i></div>
  <div class="found" id="found"></div>
  <div class="grid" id="grid"></div>
  <div class="grid hidden" id="ungrid"></div>
  <div class="floorwrap hidden" id="floor">
    <div class="floorinner">
      <div class="stagebar">
        <span class="sidenote" id="lbStairs"></span>
        <span class="sidenote" id="lbFoodL"></span>
        <div class="stage" id="lbStage"></div>
        <span class="sidenote" id="lbFoodR"></span>
      </div>
      <div class="floorcols" id="floorCols"></div>
      <div class="entrances" id="entrances"></div>
    </div>
  </div>
  <footer id="foot"></footer>
</div>
<div id="tmodal" class="hidden">
  <div class="tcard" id="tcard"></div>
</div>

function b64(s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }

function tryDecrypt(password) {
  // 以 Promise 包裝，讓「crypto.subtle 不存在」等同步例外也走 reject，不會靜默失敗
  return Promise.resolve().then(function () {
    if (!window.crypto || !crypto.subtle) { var e = new Error('no-subtle'); e.noCrypto = true; throw e; }
    return crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  })
    .then(function (base) {
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64(ENC.salt), iterations: ENC.iters, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    })
    .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(ENC.iv) }, key, b64(ENC.ct)); })
    .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
}

  btn.textContent = I18N[lang].lockBusy;
  err.textContent = '';
  tryDecrypt(pw).then(function (data) {
    try { sessionStorage.setItem('wsm.pub.pw', pw); } catch (_) {}
    unlock(data);
  }).then(null, function (ex) {
    var diag = document.getElementById('lockDiag');
    if (ex && ex.noCrypto) {
      err.textContent = I18N[lang].lockNoCrypto;
    } else if (ex && (ex.name === 'OperationError' || ex instanceof SyntaxError)) {
      err.textContent = I18N[lang].lockErr;
      diag.textContent = '';
    } else {
      err.textContent = I18N[lang].lockFail;
      diag.textContent = (ex && (ex.name || '') + ': ' + (ex.message || String(ex))).slice(0, 200)
        + ' | secure=' + String(window.isSecureContext)
        + ' | ' + navigator.userAgent.slice(0, 120);
    }
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }).then(function () {
    btn.disabled = false;
    btn.textContent = I18N[lang].lockBtn;
  });
});

document.getElementById('lockLang').addEventListener('click', function () {
  lang = lang === 'zh' ? 'en' : 'zh';
  lsSet('wsm.pub.lang', lang);
  renderLock();
});

/* ---------- 名單檢視 ---------- */
function renderList(kw) {
  var t = I18N[lang];
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  DATA.t.forEach(function (tb) {
    var hits = tb.g.filter(function (g) { return kw && g.n.toLowerCase().indexOf(kw) !== -1; });
    var card = document.createElement('div');
    card.className = 'card' + (hits.length ? ' hit' : kw ? ' dim' : '');
    var shape = tb.s === 'ROUND' ? '⭕' : '▭';
    var chips = tb.g.map(function (g) {
      var hit = kw && g.n.toLowerCase().indexOf(kw) !== -1;
      return '<span class="chip' + (hit ? ' hit' : '') + '"><span class="dot ' + g.s + '"></span>' + escHtml(g.n) + '</span>';
    }).join('');
    var posBadge = tb.p ? ' <span class="pos">' + escHtml(tb.p) + '</span>' : '';
    card.innerHTML = '<h3>' + shape + ' ' + escHtml(tb.n) + posBadge + ' <span class="cap">' + tb.g.length + '/' + tb.c + '</span></h3><div class="chips">' + chips + '</div>';
    grid.appendChild(card);
  });
}

/* ---------- 未安排名單檢視 ---------- */
function renderUnassigned(kw) {
  var t = I18N[lang];
  var grid = document.getElementById('ungrid');
  var list = DATA.u || [];
  if (!list.length) {
    grid.innerHTML = '<div class="card" style="grid-column:1/-1;text-align:center;color:#a8a29e">' + t.unEmpty + '</div>';
    return;
  }
  var chips = list.map(function (g) {
    var hit = kw && g.n.toLowerCase().indexOf(kw) !== -1;
    var dim = kw && !hit ? ' style="opacity:.35"' : '';
    return '<span class="chip' + (hit ? ' hit' : '') + '"' + dim + '><span class="dot ' + g.s + '"></span>' + escHtml(g.n) + '</span>';
  }).join('');
  grid.innerHTML = '<div class="card" style="grid-column:1/-1">'
    + '<h3>📋 ' + t.unTitle + ' <span class="cap">' + list.length + '</span></h3>'
    + '<div class="chips">' + chips + '</div></div>';
}

/* ---------- 平面圖檢視（唯讀） ---------- */
var posMap = null;
function buildPosMap() {
  posMap = {};
  DATA.t.forEach(function (tb) { if (tb.p) posMap[tb.p] = tb; });
}

function circleHtml(code, kw) {
  var tb = posMap[code];
  if (!tb) return '<button type="button" class="pc empty" tabindex="-1"><span class="pcode">' + escHtml(code) + '</span></button>';
  var hit = kw && tb.g.some(function (g) { return g.n.toLowerCase().indexOf(kw) !== -1; });
  var cls = 'pc occ' + (code === '主桌' ? ' main' : '') + (hit ? ' hitc' : kw ? ' dimc' : '');
  return '<button type="button" class="' + cls + '" data-code="' + escHtml(code) + '">'
    + '<span class="pcode">' + escHtml(code) + '</span>'
    + '<span class="pname">' + escHtml(tb.n) + '</span>'
    + '<span>' + tb.g.length + '/' + tb.c + '</span></button>';
}

function colHtml(col, kw) {
  var id = col[0], n = col[1], head = col[2];
  var html = '<div class="vcol">';
  if (head) html += circleHtml('主桌', kw);
  for (var i = 1; i <= n; i++) html += circleHtml(id + '-' + i, kw);
  return html + '</div>';
}

function renderFloor(kw) {
  var t = I18N[lang];
  document.getElementById('lbStage').textContent = t.stage + ' 960×300';
  document.getElementById('lbStairs').textContent = t.stairs;
  document.getElementById('lbFoodL').textContent = t.foodExit;
  document.getElementById('lbFoodR').textContent = t.foodExit;
  document.getElementById('entrances').innerHTML =
    '<span>▲ ' + t.entrance + '</span><span>▲ ' + t.entrance + '</span><span>▲ ' + t.entrance + '</span><span>' + t.reception + '</span>';
  var left = '<div class="cgroup leftpad">' + VENUE.left.map(function (c) { return colHtml(c, kw); }).join('') + '</div>';
  var right = '<div class="cgroup">' + VENUE.right.map(function (c) { return colHtml(c, kw); }).join('') + '</div>';
  document.getElementById('floorCols').innerHTML =
    left + '<div class="aisle"><span>' + t.walkway + '</span></div>' + right;
}

/* 點桌位圓圈 → 唯讀名單彈窗 */
document.getElementById('floor').addEventListener('click', function (e) {
  var btn = e.target.closest ? e.target.closest('.pc.occ') : null;
  if (!btn) return;
  var tb = posMap[btn.getAttribute('data-code')];
  if (!tb) return;
  var t = I18N[lang];
  var kw = q.value.trim().toLowerCase();
  var chips = tb.g.map(function (g) {
    var hit = kw && g.n.toLowerCase().indexOf(kw) !== -1;
    return '<span class="chip' + (hit ? ' hit' : '') + '"><span class="dot ' + g.s + '"></span>' + escHtml(g.n) + '</span>';
  }).join('');
  document.getElementById('tcard').innerHTML =
    '<h3><span class="pos">' + escHtml(tb.p) + '</span> ' + escHtml(tb.n) + ' <span class="cap">' + tb.g.length + '/' + tb.c + '</span></h3>'
    + '<div class="chips">' + chips + '</div>'
    + '<button type="button" class="tclose" id="tcloseBtn">' + t.close + '</button>';
  document.getElementById('tmodal').classList.remove('hidden');
});
document.getElementById('tmodal').addEventListener('click', function (e) {
  if (e.target.id === 'tmodal' || e.target.id === 'tcloseBtn') {
    document.getElementById('tmodal').classList.add('hidden');
  }
});

/* ---------- 主渲染 ---------- */
function render() {
  if (!DATA) return;
  var t = I18N[lang];
  buildPosMap();
  document.getElementById('wname').textContent = DATA.w;
  document.querySelector('[data-i18n=title]').textContent = t.title;
  document.getElementById('langBtn').textContent = t.lang;
  q.placeholder = t.hint;
  var vList = document.getElementById('vList');
  var vFloor = document.getElementById('vFloor');
  var vUn = document.getElementById('vUn');
  vList.textContent = t.viewList;
  vFloor.textContent = t.viewFloor;
  vUn.textContent = t.viewUn + '（' + ((DATA.u || []).length) + '）';
  vList.className = 'vbtn' + (view === 'list' ? ' active' : '');
  vFloor.className = 'vbtn' + (view === 'floor' ? ' active' : '');
  vUn.className = 'vbtn' + (view === 'un' ? ' active' : '');

  var kw = q.value.trim().toLowerCase();
  var hitTables = [];
  var totalGuests = 0;
  DATA.t.forEach(function (tb) {
    totalGuests += tb.g.length;
    if (kw && tb.g.some(function (g) { return g.n.toLowerCase().indexOf(kw) !== -1; })) {
      hitTables.push(tb.n + (tb.p ? '（' + tb.p + '）' : ''));
    }
  });
  var unHit = kw && (DATA.u || []).some(function (g) { return g.n.toLowerCase().indexOf(kw) !== -1; });
  document.getElementById('found').textContent = hitTables.length
    ? t.found + hitTables.join('、')
    : (unHit ? t.unTitle : '');

  // 統計列
  var unseated = (DATA.u || []).length;
  var all = totalGuests + unseated;
  var seats = DATA.t.reduce(function (n, tb) { return n + tb.c; }, 0);
  var stats = [
    [all, t.stTotal], [totalGuests, t.stSeated], [unseated, t.stUnseated],
    [DATA.t.length, t.stTables], [seats, t.stSeats],
  ];
  document.getElementById('statsRow').innerHTML = stats.map(function (p) {
    return '<div class="stat"><b>' + p[0] + '</b><span>' + p[1] + '</span></div>';
  }).join('');
  document.getElementById('progressBar').style.width = (all ? Math.round((totalGuests / all) * 100) : 0) + '%';

  document.getElementById('grid').classList.toggle('hidden', view !== 'list');
  document.getElementById('ungrid').classList.toggle('hidden', view !== 'un');
  document.getElementById('floor').classList.toggle('hidden', view !== 'floor');
  if (view === 'list') renderList(kw);
  else if (view === 'un') renderUnassigned(kw);
  else renderFloor(kw);

  document.getElementById('foot').textContent = t.stats.replace('{t}', DATA.t.length).replace('{g}', totalGuests)
    + ' · ' + new Date(DATA.generated).toLocaleString(lang === 'zh' ? 'zh-TW' : 'en-US');
}

q.addEventListener('input', render);
document.getElementById('langBtn').addEventListener('click', function () {
  lang = lang === 'zh' ? 'en' : 'zh';
  lsSet('wsm.pub.lang', lang);
  render();
});
document.getElementById('vList').addEventListener('click', function () { view = 'list'; lsSet('wsm.pub.view', view); render(); });
document.getElementById('vFloor').addEventListener('click', function () { view = 'floor'; lsSet('wsm.pub.view', view); render(); });
document.getElementById('vUn').addEventListener('click', function () { view = 'un'; lsSet('wsm.pub.view', view); render(); });

renderLock();
// 同一瀏覽器分頁重整免重輸密碼（部分 App 內瀏覽器禁用 sessionStorage，須容錯）
try {
  var saved = sessionStorage.getItem('wsm.pub.pw');
  if (saved) tryDecrypt(saved).then(unlock).then(null, function () { try { sessionStorage.removeItem('wsm.pub.pw'); } catch (_) {} });
} catch (_) {}
</script>
</body>
