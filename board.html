<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>到場看板</title>
<style>
  :root { --ink:#2f2a2c; --sub:#8a7f84; --line:#e8dfe2; --cw:40px; --gap:5px;
    --g0:#f3eff1; --g0b:#e4dde0; --gp:#fdf1da; --gpb:#eed9ab; --gf:#dcf0e3; --gfb:#a7d8ba;
    --red:#c24a65; --amber:#a9762c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; -webkit-text-size-adjust:100%; text-size-adjust:100%;
    font-family:-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:#faf7f8; color:var(--ink); font-size:15px; padding-bottom:28px; }
  header { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line);
    padding:10px 12px 9px; }
  .top { display:flex; align-items:flex-end; gap:8px; }
  .big { font-size:26px; font-weight:700; letter-spacing:.02em; line-height:1.05; flex:1; }
  .big small { font-size:13px; font-weight:400; color:var(--sub); margin-left:3px; }
  .rbtn { font:inherit; font-size:13px; background:#fff; border:1px solid var(--line);
    border-radius:999px; padding:5px 12px; color:var(--ink); }
  .bar { height:7px; border-radius:999px; background:#efe7ea; overflow:hidden; margin-top:8px; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#e8a0b8,#d8788f); width:0; transition:width .4s; }
  .meta { display:flex; align-items:center; gap:9px; margin-top:6px; font-size:11.5px; color:var(--sub); }
  #bq { width:100%; margin-top:8px; font:inherit; font-size:15px; padding:8px 11px;
    border:1px solid var(--line); border-radius:10px; background:#fdfbfc; color:var(--ink); }
  #bq::placeholder { color:#bdb2b6; }
  .tabs { display:flex; gap:6px; margin-top:8px; }
  .tabs button { flex:1; font:inherit; font-size:13px; padding:6px 0; border-radius:10px;
    border:1px solid var(--line); background:#fff; color:var(--sub); }
  .tabs button.on { background:#2f2a2c; border-color:#2f2a2c; color:#fff; }
  #warn { margin:9px 12px 0; padding:9px 11px; border-radius:10px; font-size:12.5px;
    background:#fff6e8; border:1px solid #f0dcc0; color:#8a6530; line-height:1.6; }
  #sres { margin:9px 12px 0; }
  #sres div { background:#fff; border:1px solid var(--line); border-radius:10px; padding:9px 11px;
    margin-bottom:6px; display:flex; align-items:center; gap:8px; font-size:14px; }
  #sres div b { font-weight:600; }
  #sres div span { font-size:12.5px; color:var(--sub); }
  #sres div em { margin-left:auto; font-style:normal; font-size:12.5px; color:var(--sub); }
  #sres .none { color:var(--sub); font-size:13px; justify-content:center; }

  /* ---- 平面圖 ---- */
  #plan { padding:12px 10px 4px; }
  .pStage { text-align:center; font-size:10.5px; color:#c6a3ae; letter-spacing:3px;
    border:1px solid rgba(240,180,200,.55); border-radius:7px; padding:3px 0; margin:0 auto 9px;
    max-width:62%; background:#fff; }
  .pCols { display:flex; justify-content:center; gap:var(--gap); }
  .bgroup { display:flex; gap:var(--gap); }
  .bgroup.pad { padding-top:calc(var(--cw) + var(--gap)); }
  .bwrap { display:flex; flex-direction:column; align-items:center; }
  .bwrap.hp { padding-top:calc(var(--cw) + var(--gap)); }
  .bcol { display:flex; flex-direction:column; gap:var(--gap); align-items:center; }
  .bcol.sp { justify-content:space-between; }
  .baisle { width:13px; border-radius:7px; background:repeating-linear-gradient(180deg,#fdeef3 0 8px,transparent 8px 16px); }
  .pEnt { text-align:center; font-size:10.5px; color:#c6a3ae; letter-spacing:2px; margin-top:9px; }
  .bt { width:var(--cw); height:var(--cw); border-radius:9px; border:1px solid var(--g0b);
    background:var(--g0); display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1px; line-height:1; position:relative; overflow:hidden; cursor:pointer; }
  .bt b { font-size:calc(var(--cw) * 0.26); font-weight:600; color:var(--sub); }
  .bt span { font-size:calc(var(--cw) * 0.31); font-weight:700; font-variant-numeric:tabular-nums; }
  .bt.empty { background:transparent; border-style:dashed; border-color:#ece4e7; }
  .bt.empty b { color:#d3c8cc; }
  .bt.tp { background:var(--gp); border-color:var(--gpb); }
  .bt.tp span { color:var(--amber); }
  .bt.tf { background:var(--gf); border-color:var(--gfb); }
  .bt.tf span { color:#1f6b42; }
  .bt.over { box-shadow:inset 0 0 0 2px var(--red); }
  .bt.dim { opacity:.28; }
  .bt.hit { box-shadow:0 0 0 3px #f2bfd0; z-index:1; }
  .bt.manual::after { content:''; position:absolute; top:0; right:0; width:0; height:0;
    border-top:9px solid var(--amber); border-left:9px solid transparent; }
  .legend { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:4px 10px;
    margin:12px 12px 0; font-size:11.5px; color:var(--sub); }
  .legend span { display:inline-flex; align-items:center; gap:4px; }
  .k { display:inline-block; width:11px; height:11px; border-radius:3px; border:1px solid var(--g0b); background:var(--g0); }
  .k.kp { background:var(--gp); border-color:var(--gpb); }
  .k.kf { background:var(--gf); border-color:var(--gfb); }
  .k.ko { background:#fff; border:2px solid var(--red); }
  .k.km { position:relative; overflow:hidden; }
  .k.km::after { content:''; position:absolute; top:0; right:0; width:0; height:0;
    border-top:7px solid var(--amber); border-left:7px solid transparent; }
  #unRow { margin:12px 12px 0; }
  #unRow button { width:100%; font:inherit; text-align:left; background:#fff; border:1px solid var(--line);
    border-radius:12px; padding:11px 12px; color:var(--ink); display:flex; align-items:center; gap:9px; }
  #unRow b { font-size:15px; }
  #unRow em { margin-left:auto; font-style:normal; font-variant-numeric:tabular-nums; }

  /* ---- 清單 ---- */
  ul { list-style:none; margin:0; padding:8px 10px; }
  li { background:#fff; border:1px solid var(--line); border-radius:12px; margin-bottom:7px; }
  .row { display:flex; align-items:center; gap:10px; padding:11px 12px; }
  .pos { font-weight:700; font-size:16px; min-width:50px; }
  .nm { flex:1; min-width:0; font-size:12.5px; color:var(--sub); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .cnt { font-variant-numeric:tabular-nums; font-size:14px; color:var(--sub); }
  .cnt b { font-size:19px; color:var(--ink); }
  .full .cnt b { color:#1f6b42; }
  .low .cnt b { color:var(--red); }
  .man { font-size:10.5px; color:var(--amber); margin-left:3px; }
  .sec { margin:14px 14px 5px; font-size:11.5px; color:var(--sub); letter-spacing:.08em; }
  .recent { margin:0 10px; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .recent div { display:flex; align-items:center; gap:9px; padding:9px 12px; border-top:1px solid #f4eef0; font-size:14px; }
  .recent div:first-child { border-top:0; }
  .recent em { margin-left:auto; font-style:normal; font-size:12.5px; color:var(--sub); font-variant-numeric:tabular-nums; }
  .recent .tp { font-size:12.5px; color:var(--sub); }

  /* ---- 底部名單面板 ---- */
  #sheet { position:fixed; inset:0; z-index:20; background:rgba(44,34,38,.4);
    display:flex; align-items:flex-end; }
  #sheetBox { width:100%; max-height:84vh; overflow:auto; background:#fff;
    border-radius:16px 16px 0 0; padding:14px 14px 20px;
    box-shadow:0 -10px 30px rgba(80,50,60,.18); }
  #sheetBox h3 { margin:0 0 3px; font-size:17px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  #sheetBox h3 .tag { font-size:13px; font-weight:700; background:#2f2a2c; color:#fff;
    border-radius:7px; padding:3px 8px; letter-spacing:.03em; }
  #sheetBox h3 em { margin-left:auto; font-style:normal; font-size:14px; color:var(--sub); font-variant-numeric:tabular-nums; }
  .marks { font-size:12.5px; color:var(--sub); margin:2px 0 10px; }
  .marks.overmark { color:var(--red); font-weight:600; }
  .tip { font-size:12px; color:#a7999e; margin:0 0 9px; }
  .names { display:flex; flex-wrap:wrap; gap:7px; }
  .g { font-size:14px; padding:6px 11px; border-radius:999px; border:1px solid var(--line);
    background:#fbf9fa; color:#7d7175; display:flex; align-items:center; gap:5px; max-width:100%; }
  .g .t { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .g u { text-decoration:none; font-size:10.5px; color:var(--amber); }
  .g b { font-weight:400; font-size:11.5px; color:#9aa; }
  .g.in { background:#e9f6ee; border-color:#bfe3cd; color:#1f6b42; }
  .g.in::before { content:'\2713'; font-size:11px; }
  .acts { display:flex; gap:7px; margin-top:13px; flex-wrap:wrap; }
  .acts button { flex:1 1 46%; font:inherit; font-size:14px; padding:11px 0; border-radius:11px;
    border:1px solid var(--line); background:#fff; color:var(--ink); }
  .acts button.go { background:#2f8f5b; border-color:#2f8f5b; color:#fff; }
  .acts button.warn { color:var(--red); }
  .acts button.close { flex:1 1 100%; background:#f6f1f3; }
  .mrow { display:flex; align-items:center; gap:8px; margin-top:12px; padding-top:11px;
    border-top:1px solid #f1eaec; font-size:12.5px; color:var(--sub); }
  .mrow .pm { display:flex; gap:5px; margin-left:auto; }
  .mrow button { font:inherit; min-width:40px; height:36px; border-radius:9px; border:1px solid var(--line);
    background:#fff; font-size:18px; line-height:1; color:var(--ink); padding:0 8px; }
  .mrow .mlab { flex:0 1 auto; min-width:0; }
  .mrow button[disabled] { opacity:.3; }
  #err { padding:40px 20px; text-align:center; color:var(--sub); line-height:1.9; }
  .hide { display:none !important; }
</style>
</head>
<body>
<div id="err">解密中…</div>
<div id="main" class="hide">
  <header>
    <div class="top">
      <div class="big"><span id="tot">0</span><small>／<span id="all">0</span> 位到場</small></div>
      <button type="button" class="rbtn" id="refresh">重新整理</button>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="meta"><span id="upd">—</span><span id="src"></span></div>
    <input id="bq" type="search" placeholder="搜尋姓名或桌號" autocomplete="off">
    <div class="tabs">
      <button type="button" data-v="plan" class="on">平面圖</button>
      <button type="button" data-v="list">清單</button>
      <button type="button" data-v="self">只算本人掃的</button>
    </div>
  </header>
  <div id="warn" class="hide"></div>
  <div id="sres" class="hide"></div>
  <div id="planWrap">
    <div id="plan"></div>
    <div class="legend">
      <span><i class="k"></i>未到</span>
      <span><i class="k kp"></i>部分到</span>
      <span><i class="k kf"></i>全到</span>
      <span><i class="k ko"></i>超額</span>
      <span><i class="k km"></i>人工計數</span>
      <span>點桌子看名單</span>
    </div>
    <div id="unRow" class="hide"></div>
  </div>
  <div id="listWrap" class="hide">
    <ul id="list"></ul>
    <div class="sec" id="recentHead">最近報到</div>
    <div class="recent" id="recent"></div>
  </div>
</div>
<div id="sheet" class="hide"><div id="sheetBox"></div></div>

var DATA = null, STATE = { g: {}, c: {}, t: [], now: '', inWindow: false };

var escHtml = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); };

function b64(s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
function decryptWith(blob, secret) {
  return Promise.resolve().then(function () {
    if (!window.crypto || !crypto.subtle) throw new Error('no-subtle');
    return crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveKey']);
  }).then(function (base) {
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(blob.salt), iterations: blob.iters, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }).then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(blob.iv) }, k, b64(blob.ct)); })
    .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
}

function devId() {
  var v = null;
  try { v = localStorage.getItem('wsm.board.dev'); } catch (e) {}
  if (!v) {
    v = 'board-' + Math.random().toString(36).slice(2, 8);
    try { localStorage.setItem('wsm.board.dev', v); } catch (e) {}
  }
  return v;
}

/* ---- JSONP：Apps Script 的 302 會讓 fetch 讀不到，用 script 標籤最穩 ---- */
var jseq = 0;
function jsonp(params, done) {
  if (!DATA.ck) { done(null); return; }
  var cb = 'wsmcb' + (++jseq) + '_' + Date.now().toString(36);
  var s = document.createElement('script');
  var timer = setTimeout(function () { cleanup(); done(null); }, 15000);
  function cleanup() { clearTimeout(timer); try { delete window[cb]; } catch (e) { window[cb] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); }
  window[cb] = function (r) { cleanup(); done(r); };
  var qs = ['callback=' + cb, 'token=' + encodeURIComponent(DATA.ck.t)];
  for (var k in params) qs.push(k + '=' + encodeURIComponent(params[k]));
  s.src = DATA.ck.u + (DATA.ck.u.indexOf('?') === -1 ? '?' : '&') + qs.join('&');
  s.onerror = function () { cleanup(); done(null); };
  document.body.appendChild(s);
}

function load(cb) {
  jsonp({ action: 'checkinList' }, function (r) {
    if (r && r.ok) {
      STATE.g = {};
      for (var i = 0; i < r.g.length; i++) STATE.g[r.g[i][0]] = { src: r.g[i][1], at: r.g[i][2] };
      STATE.c = r.c || {};
      STATE.t = r.t || [];
      STATE.now = r.now || '';
      STATE.inWindow = !!r.inWindow;
      document.getElementById('upd').textContent = STATE.now + ' 更新';
    } else {
      document.getElementById('upd').textContent = '讀取失敗，稍後自動重試';
    }
    render();
    if (cb) cb();
  });
}

/* ---- 名字 ---- */
function dn(g) { return (g && (g.d || g.n)) || ''; }
function arrived(g) {
  var s = STATE.g[g.n];
  if (!s) return false;
  return selfOnly ? s.src === 'qr-self' || s.src === 'manual' : true;
}
function atOf(g) { var s = STATE.g[g.n]; return (s && s.at) || ''; }
function nArrived(list) {
  var n = 0;
  for (var i = 0; i < list.length; i++) if (arrived(list[i])) n += 1;
  return n;
}
/* 顯示人數：接待有下人工計數就以人工為準，否則用名字算 */
function shown(tb) {
  var m = STATE.c[tb.p];
  return m === undefined || m === null ? nArrived(tb.g) : m;
}
function isMan(tb) { return STATE.c[tb.p] !== undefined && STATE.c[tb.p] !== null; }

/* ---- 搜尋 ---- */
var kw = '', hitCodes = null;
function norm(s) { return String(s || '').toLowerCase().split(' ').join('').split('　').join(''); }
function runSearch() {
  kw = norm(document.getElementById('bq').value);
  var box = document.getElementById('sres');
  if (!kw) { hitCodes = null; box.className = 'hide'; box.innerHTML = ''; return; }
  hitCodes = {};
  var rows = [], i, j;
  for (i = 0; i < DATA.t.length; i++) {
    var tb = DATA.t[i];
    if (norm(tb.p).indexOf(kw) !== -1 || norm(tb.nm).indexOf(kw) !== -1) {
      hitCodes[tb.p] = 1;
      if (rows.length < 10) rows.push(['', tb.nm || '', tb.p, tb.p]);
    }
    for (j = 0; j < tb.g.length; j++) {
      var g = tb.g[j];
      if (norm(g.n).indexOf(kw) !== -1 || norm(dn(g)).indexOf(kw) !== -1) {
        hitCodes[tb.p] = 1;
        if (rows.length < 10) rows.push([dn(g), tb.nm || '', tb.p, tb.p]);
      }
    }
  }
  for (j = 0; j < (DATA.u || []).length; j++) {
    var ug = DATA.u[j];
    if (norm(ug.n).indexOf(kw) !== -1 || norm(dn(ug)).indexOf(kw) !== -1) {
      if (rows.length < 10) rows.push([dn(ug), '尚未安排座位', '未排', '__un']);
    }
  }
  if (!rows.length) {
    box.innerHTML = '<div class="none">找不到「' + escHtml(document.getElementById('bq').value) + '」</div>';
  } else {
    box.innerHTML = rows.map(function (r) {
      return '<div data-code="' + escHtml(r[3]) + '"><b>' + escHtml(r[0] || r[1]) + '</b>'
        + (r[0] ? '<span class="tp">' + escHtml(r[1]) + '</span>' : '')
        + '<em>' + escHtml(r[2]) + ' 桌</em></div>';
    }).join('');
  }
  box.className = '';
}

/* ---- 平面圖 ---- */
function cellHtml(code) {
  var tb = posMap[code];
  if (!tb) return '<div class="bt empty"><b>' + escHtml(code) + '</b></div>';
  var tot = tb.g.length, n = shown(tb);
  var cls = 'bt occ ' + (tot > 0 && n >= tot ? 'tf' : n > 0 ? 'tp' : 't0');
  if (n > tot) cls += ' over';
  if (isMan(tb)) cls += ' manual';
  if (hitCodes) cls += hitCodes[code] ? ' hit' : ' dim';
  return '<div class="' + cls + '" data-code="' + escHtml(code) + '"><b>' + escHtml(code) + '</b>'
    + '<span>' + n + '/' + tot + '</span></div>';
}
function colHtml(c, groupHasHead) {
  var id = c[0], nums = c[1], head = c[2], spread = c[3];
  var style = spread ? ' style="min-height:calc(var(--cw) * ' + spread + ' + var(--gap) * ' + (spread - 1) + ')"' : '';
  var h = '<div class="bwrap' + (groupHasHead && !head ? ' hp' : '') + '">'
    + '<div class="bcol' + (spread ? ' sp' : '') + '"' + style + '>';
  if (head) h += cellHtml('主桌');
  for (var i = 0; i < nums.length; i++) h += cellHtml(id + '-' + nums[i]);
  return h + '</div></div>';
}
function renderPlan() {
  var lh = false, rh = false, i;
  for (i = 0; i < VENUE.left.length; i++) if (VENUE.left[i][2]) lh = true;
  for (i = 0; i < VENUE.right.length; i++) if (VENUE.right[i][2]) rh = true;
  var left = '<div class="bgroup pad">' + VENUE.left.map(function (c) { return colHtml(c, lh); }).join('') + '</div>';
  var right = '<div class="bgroup">' + VENUE.right.map(function (c) { return colHtml(c, rh); }).join('') + '</div>';
  document.getElementById('plan').innerHTML =
    '<div class="pStage">舞 台</div>'
    + '<div class="pCols">' + left + '<div class="baisle"></div>' + right + '</div>'
    + '<div class="pEnt">▲ 入口・接待桌</div>';
  var un = document.getElementById('unRow');
  if ((DATA.u || []).length) {
    un.innerHTML = '<button type="button" data-code="__un"><b>未排</b>'
      + '<span class="nm">尚未安排座位</span><em>' + nArrived(DATA.u) + '/' + DATA.u.length + '</em></button>';
    un.className = '';
  } else { un.className = 'hide'; un.innerHTML = ''; }

}
/* 一眼看完整場：依畫面寬度算出格子邊長（8 欄＋走道＋間距） */
function fitPlan() {
  var el = document.getElementById('plan');
  if (!el || el.offsetParent === null) return;
  var W = el.clientWidth - 20;
  var cw = Math.floor((W - 13 - 8 * 5) / 8);
  if (cw < 30) cw = 30;
  if (cw > 64) cw = 64;
  el.style.setProperty('--cw', cw + 'px');
}

  }
  for (j = 0; j < (DATA.u || []).length; j++) if (arrived(DATA.u[j])) all.push([atOf(DATA.u[j]), dn(DATA.u[j]), '未排']);
  all.sort(function (a, b) { return a[0] < b[0] ? 1 : a[0] > b[0] ? -1 : 0; });
  var r = document.getElementById('recent');
  document.getElementById('recentHead').textContent = '最近報到（共 ' + all.length + ' 位）';
  r.innerHTML = all.slice(0, 15).map(function (x) {
    return '<div><b>' + escHtml(x[1]) + '</b><span class="tp">' + escHtml(x[2]) + ' 桌</span><em>' + escHtml(x[0]) + '</em></div>';
  }).join('') || '<div><span class="tp">還沒有人報到</span></div>';
}

/* ---- 總渲染 ---- */
function render() {
  if (!DATA) return;
  var tot = 0, all = 0, i;
  for (i = 0; i < DATA.t.length; i++) { tot += shown(DATA.t[i]); all += DATA.t[i].g.length; }
  if (DATA.u) { tot += nArrived(DATA.u); all += DATA.u.length; }
  document.getElementById('tot').textContent = tot;
  document.getElementById('all').textContent = all;
  document.getElementById('barFill').style.width = (all ? Math.min(100, (tot / all) * 100) : 0) + '%';
  document.getElementById('src').textContent = selfOnly ? '只算本人掃的' : '';

  if (view === 'plan') renderPlan(); else renderList();
  document.getElementById('planWrap').className = view === 'plan' ? '' : 'hide';
  document.getElementById('listWrap').className = view === 'list' ? '' : 'hide';

  var w = document.getElementById('warn');
  var msg = [];
  if (!STATE.inWindow) msg.push('⚠️ 現在不在簽到時間窗內，報到紀錄會標成測試、不列入統計。');
  if (STATE.t.length) msg.push('另有 ' + STATE.t.length + ' 筆時間窗外的測試紀錄（未計入）。');
  if (msg.length) { w.innerHTML = msg.join('<br>'); w.className = ''; } else { w.className = 'hide'; }

  if (openCode) renderSheet();
}

/* ---- 底部名單面板 ---- */
function tableOf(code) {
  if (code === '__un') return { p: '未排', nm: '尚未安排座位', cap: 0, g: DATA.u || [], un: 1 };
  return posMap[code] || null;
}
function renderSheet() {
  var tb = tableOf(openCode);
  if (!tb) { closeSheet(); return; }
  var n = tb.un ? nArrived(tb.g) : shown(tb);
  var tot = tb.g.length, veg = 0, kid = 0, ten = 0, i;
  for (i = 0; i < tb.g.length; i++) {
    if (tb.g[i].v) veg += 1;
    if (tb.g[i].k) kid += 1;
    if (tb.g[i].t) ten += 1;
  }
  var marks = [];
  if (veg) marks.push('素食 ' + veg);
  if (kid) marks.push('兒童椅 ' + kid);
  if (ten) marks.push('暫定 ' + ten);
  // 上限是後台自動算的（主桌 20／有素食 11／其他 10），這裡照樣顯示，超編要看得出來
  var overBy = !tb.un && tb.cap ? tot - tb.cap : 0;
  if (!tb.un && tb.cap) marks.push(tot + ' 位／' + tb.cap + ' 席');

  var chips = tb.g.map(function (g) {
    var on = arrived(g);
    var tags = (g.v ? '素' : '') + (g.k ? '椅' : '') + (g.t ? '暫' : '');
    return '<span class="g' + (on ? ' in' : '') + '" data-g="' + escHtml(g.n) + '">'
      + '<span class="t">' + escHtml(dn(g)) + '</span>'
      + (tags ? '<u>' + tags + '</u>' : '')
      + (on && atOf(g) ? '<b>' + escHtml(atOf(g)) + '</b>' : '')
      + '</span>';
  }).join('') || '<span class="g"><span class="t">這桌還沒有人</span></span>';

  var left = tot - nArrived(tb.g);
  var who = tb.un ? '這 ' : '這桌 ';
  var whose = tb.un ? '這幾位' : '這桌';
  var acts = '';
  if (left > 0) acts += '<button type="button" class="go" data-act="allin">' + who + left + ' 位全到了</button>';
  if (nArrived(tb.g) > 0) {
    acts += armed === 'clear'
      ? '<button type="button" class="warn" data-act="clear2">確定清掉' + whose + '的報到？</button>'
      : '<button type="button" class="warn" data-act="clear">清掉' + whose + '的報到</button>';
  }
  acts += '<button type="button" class="close" data-act="close">關閉</button>';

  var man = '';
  if (!tb.un) {
    man = '<div class="mrow"><span class="mlab">人工計數' + (isMan(tb) ? '：以 ' + STATE.c[tb.p] + ' 位為準' : '（不點名，直接數人頭）') + '</span>'
      + '<span class="pm"><button type="button" data-act="reset" title="改回用點名計算"'
      + (isMan(tb) ? '' : ' disabled') + '>↺</button>'
      + '<button type="button" data-act="minus">−</button>'
      + '<button type="button" data-act="plus">+</button></span></div>';
  }

  document.getElementById('sheetBox').innerHTML =
    '<h3><span class="tag">' + escHtml(tb.p) + '</span>' + escHtml(tb.nm || '') + '<em>' + n + '／' + tot + ' 位到場</em></h3>'
    + (marks.length ? '<div class="marks' + (overBy > 0 ? ' overmark' : '') + '">' + escHtml(marks.join('・'))
        + (overBy > 0 ? '　超編 ' + overBy + ' 位' : '') + '</div>' : '')
    + '<p class="tip">點名字＝手動標記到場，再點一次取消。</p>'
    + '<div class="names">' + chips + '</div>'
    + '<div class="acts">' + acts + '</div>' + man;
  document.getElementById('sheet').className = '';
}
function openSheet(code) { openCode = code; armed = null; renderSheet(); }
function closeSheet() {
  openCode = null; armed = null;
  document.getElementById('sheet').className = 'hide';
  document.getElementById('sheetBox').innerHTML = '';
}

/* ---- 寫回試算表 ---- */
function setCount(pos, n) {
  if (busy) return;
  busy = true;
  if (n < 0) delete STATE.c[pos]; else STATE.c[pos] = n;
  render();
  jsonp({ action: 'count', pos: pos, n: n, dev: devId() }, function () { busy = false; load(); });
}
function markRows(rows, src) {
  if (busy || !rows.length) return;
  busy = true;
  for (var i = 0; i < rows.length; i++) {
    if (src === 'undo') delete STATE.g[rows[i][0]];
    else STATE.g[rows[i][0]] = { src: 'manual', at: '' };
  }
  render();
  jsonp({ action: 'checkin', p: JSON.stringify(rows), dev: devId() }, function () { busy = false; load(); });
}

/* ---- 事件 ---- */
document.addEventListener('click', function (e) {
  if (!e.target.closest) return;

  /* 面板內 */
  var act = e.target.closest('[data-act]');
  if (act) {
    var a = act.getAttribute('data-act');
    var tb = tableOf(openCode);
    if (a === 'close') { closeSheet(); return; }
    if (!tb) return;
    var pos = tb.un ? '' : tb.p;
    if (a === 'allin') {
      var rows = [];
      for (var i = 0; i < tb.g.length; i++) if (!arrived(tb.g[i])) rows.push([tb.g[i].n, pos, 'manual']);
      markRows(rows, 'manual');
      return;
    }
    if (a === 'clear') { armed = 'clear'; renderSheet(); return; }
    if (a === 'clear2') {
      var un = [];
      for (var j = 0; j < tb.g.length; j++) if (arrived(tb.g[j])) un.push([tb.g[j].n, pos, 'undo']);
      armed = null;
      markRows(un, 'undo');
      return;
    }
    if (tb.un) return;
    if (a === 'reset') setCount(tb.p, -1);
    else setCount(tb.p, Math.max(0, Math.min(99, shown(tb) + (a === 'plus' ? 1 : -1))));
    return;
  }

  var chip = e.target.closest('.g[data-g]');
  if (chip) {
    var tb2 = tableOf(openCode);
    if (!tb2) return;
    var nm = chip.getAttribute('data-g');
    var was = chip.classList.contains('in');
    markRows([[nm, tb2.un ? '' : tb2.p, was ? 'undo' : 'manual']], was ? 'undo' : 'manual');
    return;
  }
  if (e.target.id === 'sheet') { closeSheet(); return; }

  /* 平面圖 / 清單 / 搜尋結果 → 開名單 */
  var cell = e.target.closest('[data-code]');
  if (cell) { openSheet(cell.getAttribute('data-code')); return; }
});

document.getElementById('refresh').addEventListener('click', function () {
  document.getElementById('upd').textContent = '讀取中…';
  load();
});
document.getElementById('bq').addEventListener('input', function () { runSearch(); render(); });
document.querySelector('.tabs').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-v]');
  if (!b) return;
  var v = b.getAttribute('data-v');
  if (v === 'self') { selfOnly = !selfOnly; b.classList.toggle('on', selfOnly); render(); return; }
  view = v;
  var all = this.querySelectorAll('button[data-v]');
  for (var i = 0; i < all.length; i++) {
    var k = all[i].getAttribute('data-v');
    if (k !== 'self') all[i].classList.toggle('on', k === v);
  }
  render();
});
window.addEventListener('resize', fitPlan);

(function () {
  var m = (location.hash || '').match(/[#&]b=([^&]+)/);
  if (!m) { document.getElementById('err').textContent = '網址少了金鑰，請用完整的看板網址開啟。'; return; }
  decryptWith(ENC_BOARD, decodeURIComponent(m[1])).then(function (d) {
    DATA = d;
    posMap = {};
    for (var i = 0; i < DATA.t.length; i++) if (DATA.t[i].p) posMap[DATA.t[i].p] = DATA.t[i];
    document.getElementById('err').classList.add('hide');
    document.getElementById('main').classList.remove('hide');
    document.title = (d.w || '到場看板') + '｜到場看板';
    render();
    load();
    setInterval(function () { if (!busy) load(); }, 15000);
  }).then(null, function () {
    document.getElementById('err').textContent = '金鑰不對，或這個瀏覽器不支援解密。請改用 Chrome／Safari 開啟完整網址。';
  });
})();
</script>
</body>
