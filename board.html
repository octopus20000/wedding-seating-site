<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>到場看板</title>
<style>
  :root { --ink:#2f2a2c; --sub:#8a7f84; --line:#e8dfe2; --ok:#2f8f5b; --warn:#c2762a; --bad:#b4475f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:#faf7f8; color:var(--ink); font-size:15px; padding-bottom:40px; }
  header { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line);
    padding:12px 14px 10px; }
  .big { font-size:26px; font-weight:700; letter-spacing:.02em; }
  .big small { font-size:14px; font-weight:400; color:var(--sub); margin-left:4px; }
  .meta { display:flex; align-items:center; gap:10px; margin-top:6px; font-size:12px; color:var(--sub); }
  .meta button { font:inherit; background:#fff; border:1px solid var(--line); border-radius:999px;
    padding:4px 11px; color:var(--ink); }
  .bar { height:7px; border-radius:999px; background:#efe7ea; overflow:hidden; margin-top:9px; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#e8a0b8,#d8788f); width:0; transition:width .4s; }
  .tabs { display:flex; gap:6px; margin-top:10px; }
  .tabs button { flex:1; font:inherit; font-size:13px; padding:6px 0; border-radius:10px;
    border:1px solid var(--line); background:#fff; color:var(--sub); }
  .tabs button.on { background:#2f2a2c; border-color:#2f2a2c; color:#fff; }
  #warn { margin:10px 14px 0; padding:9px 11px; border-radius:10px; font-size:12.5px;
    background:#fff6e8; border:1px solid #f0dcc0; color:#8a6530; }
  ul { list-style:none; margin:0; padding:8px 10px; }
  li { background:#fff; border:1px solid var(--line); border-radius:12px; margin-bottom:7px; }
  .row { display:flex; align-items:center; gap:10px; padding:11px 12px; }
  .pos { font-weight:700; font-size:16px; min-width:52px; }
  .nm { flex:1; min-width:0; font-size:12.5px; color:var(--sub); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .cnt { font-variant-numeric:tabular-nums; font-size:15px; }
  .cnt b { font-size:19px; }
  .full .cnt b { color:var(--ok); }
  .low .cnt b { color:var(--bad); }
  .man { font-size:10.5px; color:var(--warn); margin-left:3px; }
  .pm { display:flex; gap:5px; }
  .pm button { font:inherit; width:32px; height:32px; border-radius:9px; border:1px solid var(--line);
    background:#fff; font-size:17px; line-height:1; color:var(--ink); }
  .names { display:none; flex-wrap:wrap; gap:6px; padding:0 12px 11px; }
  li.open .names { display:flex; }
  .g { font-size:13px; padding:5px 11px; border-radius:999px; border:1px solid var(--line);
    background:#fbf9fa; color:#9a8f94; }
  .g.in { background:#eef7f1; border-color:#cde7d8; color:#2f6f4c; }
  .g.in::before { content:'\2713'; margin-right:4px; font-size:11px; }
  .sec { margin:14px 14px 4px; font-size:12px; color:var(--sub); letter-spacing:.08em; }
  #err { padding:40px 20px; text-align:center; color:var(--sub); line-height:1.9; }
  .hide { display:none !important; }
</style>
</head>

var DATA = null, STATE = { g: {}, c: {}, t: [], now: '', inWindow: false };
var filter = 'all', selfOnly = false, busy = false;
var escHtml = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };

function b64(s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
function decryptWith(blob, secret) {
  return Promise.resolve().then(function () {
    if (!window.crypto || !crypto.subtle) throw new Error('no-subtle');
    return crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveKey']);
  }).then(function (base) {
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(blob.salt), iterations: blob.iters, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }).then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(blob.iv) }, k, b64(blob.ct)); })
    .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
}

function devId() {
  var v = null;
  try { v = localStorage.getItem('wsm.board.dev'); } catch (e) {}
  if (!v) {
    v = 'board-' + Math.random().toString(36).slice(2, 8);
    try { localStorage.setItem('wsm.board.dev', v); } catch (e) {}
  }
  return v;
}

/* ---- JSONP：Apps Script 的 302 會讓 fetch 讀不到，用 script 標籤最穩 ---- */
var jseq = 0;
function jsonp(params, done) {
  if (!DATA.ck) { done(null); return; }
  var cb = 'wsmcb' + (++jseq) + '_' + Date.now().toString(36);
  var s = document.createElement('script');
  var timer = setTimeout(function () { cleanup(); done(null); }, 15000);
  function cleanup() { clearTimeout(timer); try { delete window[cb]; } catch (e) { window[cb] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); }
  window[cb] = function (r) { cleanup(); done(r); };
  var qs = ['callback=' + cb, 'token=' + encodeURIComponent(DATA.ck.t)];
  for (var k in params) qs.push(k + '=' + encodeURIComponent(params[k]));
  s.src = DATA.ck.u + (DATA.ck.u.indexOf('?') === -1 ? '?' : '&') + qs.join('&');
  s.onerror = function () { cleanup(); done(null); };
  document.body.appendChild(s);
}

function load(cb) {
  jsonp({ action: 'checkinList' }, function (r) {
    if (r && r.ok) {
      STATE.g = {};
      for (var i = 0; i < r.g.length; i++) STATE.g[r.g[i][0]] = { src: r.g[i][1], at: r.g[i][2] };
      STATE.c = r.c || {};
      STATE.t = r.t || [];
      STATE.now = r.now || '';
      STATE.inWindow = !!r.inWindow;
      document.getElementById('upd').textContent = STATE.now + ' 更新';
    } else {
      document.getElementById('upd').textContent = '讀取失敗，稍後自動重試';
    }
    render();
    if (cb) cb();
  });
}

function arrived(name) {
  var s = STATE.g[name];
  if (!s) return false;
  return selfOnly ? s.src === 'qr-self' || s.src === 'manual' : true;
}

function scanned(tb) {
  var n = 0;
  for (var i = 0; i < tb.g.length; i++) if (arrived(tb.g[i])) n += 1;
  return n;
}

function shown(tb) {
  var m = STATE.c[tb.p];
  return m === undefined || m === null ? scanned(tb) : m;
}

function render() {
  var ul = document.getElementById('list');
  var open = {};
  var items = ul.querySelectorAll('li.open');
  for (var q = 0; q < items.length; q++) open[items[q].getAttribute('data-pos')] = 1;

  var html = '';
  var tot = 0, all = 0;
  for (var i = 0; i < DATA.t.length; i++) {
    var tb = DATA.t[i];
    var n = shown(tb), cap = tb.cap || tb.g.length;
    tot += n;
    all += tb.g.length;
    var man = STATE.c[tb.p] !== undefined && STATE.c[tb.p] !== null;
    var cls = n >= tb.g.length && tb.g.length > 0 ? 'full' : n * 2 < tb.g.length ? 'low' : '';
    if (filter === 'low' && n >= tb.g.length) continue;
    html += '<li data-pos="' + escHtml(tb.p) + '" class="' + cls + (open[tb.p] ? ' open' : '') + '">'
      + '<div class="row">'
      + '<span class="pos">' + escHtml(tb.p || '—') + '</span>'
      + '<span class="nm">' + escHtml(tb.nm || '') + '（' + tb.g.length + ' 位／' + cap + ' 席）</span>'
      + '<span class="cnt"><b>' + n + '</b>' + (man ? '<span class="man">人工</span>' : '') + '</span>'
      + '<span class="pm">'
      + '<button type="button" data-act="minus">−</button>'
      + '<button type="button" data-act="plus">+</button>'
      + (man ? '<button type="button" data-act="reset" title="取消人工計數">↺</button>' : '')
      + '</span></div>'
      + '<div class="names">'
      + tb.g.map(function (nm) {
          return '<span class="g' + (arrived(nm) ? ' in' : '') + '" data-g="' + escHtml(nm) + '" data-tp="' + escHtml(tb.p) + '">' + escHtml(nm) + '</span>';
        }).join('')
      + '</div></li>';
  }

  if (DATA.u && DATA.u.length) {
    var un = 0;
    for (var u = 0; u < DATA.u.length; u++) if (arrived(DATA.u[u])) un += 1;
    tot += un;
    all += DATA.u.length;
    if (filter !== 'low' || un < DATA.u.length) {
      html += '<li data-pos="__un" class="' + (open.__un ? 'open' : '') + '"><div class="row">'
        + '<span class="pos">未排</span>'
        + '<span class="nm">尚未安排座位（' + DATA.u.length + ' 位）</span>'
        + '<span class="cnt"><b>' + un + '</b></span></div>'
        + '<div class="names">'
        + DATA.u.map(function (nm) {
            return '<span class="g' + (arrived(nm) ? ' in' : '') + '" data-g="' + escHtml(nm) + '" data-tp="">' + escHtml(nm) + '</span>';
          }).join('')
        + '</div></li>';
    }
  }

  ul.innerHTML = html || '<li><div class="row"><span class="nm">沒有符合的桌次</span></div></li>';
  document.getElementById('tot').textContent = tot;
  document.getElementById('all').textContent = all;
  document.getElementById('barFill').style.width = (all ? Math.min(100, (tot / all) * 100) : 0) + '%';

  var w = document.getElementById('warn');
  var msg = [];
  if (!STATE.inWindow) msg.push('⚠️ 現在不在簽到時間窗內，賓客掃到的紀錄會標成測試、不列入統計。');
  if (STATE.t.length) msg.push('另有 ' + STATE.t.length + ' 筆時間窗外的測試紀錄（未計入）。');
  if (msg.length) { w.innerHTML = msg.join('<br>'); w.classList.remove('hide'); }
  else w.classList.add('hide');
  document.getElementById('src').textContent = selfOnly ? '只算本人掃的' : '';
}

function setCount(pos, n) {
  if (busy) return;
  busy = true;
  STATE.c[pos] = n < 0 ? null : n;
  if (n < 0) delete STATE.c[pos];
  render();
  jsonp({ action: 'count', pos: pos, n: n, dev: devId() }, function () { busy = false; load(); });
}

function mark(name, pos, on) {
  if (busy) return;
  busy = true;
  if (on) STATE.g[name] = { src: 'manual', at: '' };
  else delete STATE.g[name];
  render();
  jsonp({ action: 'checkin', n: name, pos: pos, src: on ? 'manual' : 'undo', dev: devId() }, function () { busy = false; load(); });
}

document.getElementById('list').addEventListener('click', function (e) {
  var btn = e.target.closest('button[data-act]');
  if (btn) {
    var li = btn.closest('li');
    var pos = li.getAttribute('data-pos');
    if (pos === '__un') return;
    var tb = null;
    for (var i = 0; i < DATA.t.length; i++) if (DATA.t[i].p === pos) tb = DATA.t[i];
    if (!tb) return;
    var act = btn.getAttribute('data-act');
    if (act === 'reset') setCount(pos, -1);
    else setCount(pos, Math.max(0, Math.min(99, shown(tb) + (act === 'plus' ? 1 : -1))));
    return;
  }
  var g = e.target.closest('.g');
  if (g) {
    mark(g.getAttribute('data-g'), g.getAttribute('data-tp') || '', !g.classList.contains('in'));
    return;
  }
  var li2 = e.target.closest('li');
  if (li2) li2.classList.toggle('open');
});

document.getElementById('refresh').addEventListener('click', function () {
  document.getElementById('upd').textContent = '讀取中…';
  load();
});
document.querySelector('.tabs').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-f]');
  if (!b) return;
  var f = b.getAttribute('data-f');
  if (f === 'self') { selfOnly = !selfOnly; b.classList.toggle('on', selfOnly); render(); return; }
  filter = f;
  var all = this.querySelectorAll('button[data-f]');
  for (var i = 0; i < all.length; i++) {
    var k = all[i].getAttribute('data-f');
    if (k !== 'self') all[i].classList.toggle('on', k === f);
  }
  render();
});

(function () {
  var m = (location.hash || '').match(/[#&]b=([^&]+)/);
  if (!m) { document.getElementById('err').textContent = '網址少了金鑰，請用完整的看板網址開啟。'; return; }
  decryptWith(ENC_BOARD, decodeURIComponent(m[1])).then(function (d) {
    DATA = d;
    document.getElementById('err').classList.add('hide');
    document.getElementById('main').classList.remove('hide');
    document.title = (d.w || '到場看板') + '｜到場看板';
    render();
    load();
    setInterval(function () { if (!busy) load(); }, 15000);
  }).then(null, function () {
    document.getElementById('err').textContent = '金鑰不對，或這個瀏覽器不支援解密。請改用 Chrome／Safari 開啟完整網址。';
  });
})();
</script>
</body>
</html>
